# (https://en.wikipedia.org/wiki/.378_Weatherby_Magnum; the .460: COTW 18 p. 434), and A-Square's rounds
# on it and on the .460 (pp. 401, 415, 434, 443).
name = ".378 Weatherby Magnum"
differ_by = ["bore", "length"]
calibres = [".378 Weatherby Magnum", ".30-378 Weatherby Magnum", ".338-378 Weatherby Magnum", ".338 A-Square",
            ".375 A-Square", ".416 Weatherby Magnum", ".460 Weatherby Magnum", ".460 A-Square Short", ".500 A-Square"]

[[group]]
# A-Square's rimmed double rifle rounds share one case (COTW 18 p. 453).
name = ".416 Rimmed"
differ_by = ["bore"]
calibres = [".416 Rimmed", ".450 Assegai"]

[[group]]
# The full-length .375 H&H Magnum case blown out (COTW 18 pp. 418, 426); the .416 Remington Magnum
# measures almost like the .416 Hoffman.
name = ".375 H&H Magnum"
differ_by = ["bore"]
calibres = [".375 H&H Magnum", ".416 Hoffman", ".416 Remington Magnum", ".400 A-Square DPM"]

[[group]]
# COTW 18 p. 397: the .338 Lapua Magnum head and body, longer.
name = ".338 Lapua Magnum"
differ_by = ["length"]
calibres = [".338 Lapua Magnum", ".33 XC"]
