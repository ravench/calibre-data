# Lookalikes (Raven 2026-11-08): calibres that are cartridges of their own but look alike, so an app
# can show the others from any one of them. A group's cases share one design; `differ_by` says what tells
# them apart: rim (rimmed or rimless twin), bore (bullet diameter), length (case length), seating (a
# wadcutter seated flush or nearly so) and load (C.I.P., SAAMI or the service gives the same case a hotter
# load or another chamber that the older or weaker guns must not fire). Other names of the same cartridge
# are search aliases, not groups. Judged against Cartridges of the World (15th ed., 2016) and the C.I.P.
# and SAAMI lists. Each calibre is in at most one group; a group lists its parent first.

[[group]]
differ_by = ["load"]
calibres = [".223 Remington", "5.56x45 mm NATO", "5.6 mm GP 90"]

[[group]]
differ_by = ["load"]
calibres = [".308 Winchester", "7.62x51 mm NATO"]

[[group]]
differ_by = ["load"]
calibres = [".38 ACP", ".38 Super"]

[[group]]
differ_by = ["load"]
calibres = ["9x19 mm", "9 mm Glisenti"]

[[group]]
differ_by = ["load"]
calibres = ["9x23 mm Largo", "9x23 mm Winchester"]

[[group]]
differ_by = ["seating"]
calibres = [".32 S&W Long", ".32 S&W Long Wadcutter"]

[[group]]
differ_by = ["seating"]
calibres = [".38 Special", ".38 Special Wadcutter"]

[[group]]
differ_by = ["rim", "load"]
calibres = ["7x57 mm Mauser", "7x57 mm R", ".275 Rigby"]

[[group]]
differ_by = ["rim"]
calibres = ["6.5x57 mm Mauser", "6.5x57 mm R"]

[[group]]
differ_by = ["rim", "length"]
calibres = ["7x64 mm", "7x65 mm R"]

[[group]]
differ_by = ["rim", "bore"]
calibres = ["8x57 mm IS", "8x57 mm IRS", "8x57 mm I", "8x57 mm IR"]

[[group]]
differ_by = ["rim"]
calibres = [".45 ACP", ".45 Auto Rim"]

[[group]]
differ_by = ["rim"]
calibres = ["5.6x50 mm Magnum", "5.6x50 mm R Magnum"]

[[group]]
differ_by = ["rim"]
calibres = ["5.6x57 mm", "5.6x57 mm R"]

[[group]]
differ_by = ["rim"]
calibres = ["6.5x65 mm RWS", "6.5x65 mm R RWS"]

[[group]]
differ_by = ["rim"]
calibres = ["6.5x68 mm", "6.5x68 mm R"]

[[group]]
differ_by = ["rim"]
calibres = ["8x60 mm S", "8x60 mm RS"]

[[group]]
differ_by = ["rim", "length"]
calibres = ["8x64 mm S", "8x65 mm RS"]

[[group]]
differ_by = ["rim"]
calibres = ["9x57 mm Mauser", "9x57 mm R"]

[[group]]
differ_by = ["bore"]
calibres = ["7.62x54 mm R", "7.62x53 mm R"]

[[group]]
differ_by = ["length"]
calibres = [".450/400 Nitro Express 3 inch", ".450/400 Nitro Express 3¼ inch"]
