# Calibres that are cartridges of their own but look alike, so an app can show the others from any
# one of them. Each [[group]] has a name (its parent's, or the family's), lists its calibres, the
# parent first, and differ_by, what tells them apart: rim, bore, length, seating, load or ignition
# (see Lookalikes in README.md). A calibre is in one group at most.

[[group]]
name = ".223 Remington"
differ_by = ["load"]
calibres = [".223 Remington", "5.56x45 mm NATO", "5.6 mm GP 90"]

[[group]]
# The Swiss 7.5 mm rounds of the IG 89: the 1890 round, its 1923 rework on a 1 mm longer case, and the
# reduced cadet load on that case (Poyer p. 50). The 1890 paper-patched bullet is 8.15 across, the
# later jacketed ones 7.8.
name = "7.5x53.5 mm Swiss (GP 1890)"
differ_by = ["bore", "length", "load"]
calibres = ["7.5x53.5 mm Swiss (GP 1890)", "7.5x54.5 mm Swiss (GP 90/23)", "7.5 mm Kadettenpatrone"]

