# Calibres that are cartridges of their own but look alike, so an app can show the others from any
# one of them. Each [[group]] lists its calibres, the parent first, and differ_by, what tells them
# apart: rim, bore, length, seating, load or ignition (see Lookalikes in README.md). A calibre is in
# one group at most.

[[group]]
differ_by = ["load"]
calibres = [".223 Remington", "5.56x45 mm NATO", "5.6 mm GP 90"]

[[group]]
differ_by = ["load"]
calibres = [".308 Winchester", "7.62x51 mm NATO"]

[[group]]
differ_by = ["load"]
calibres = [".38 ACP", ".38 Super"]

[[group]]
differ_by = ["load"]
calibres = ["9x19 mm", "9 mm Glisenti"]

[[group]]
differ_by = ["load"]
calibres = ["9x23 mm Largo", "9x23 mm Winchester"]

[[group]]
differ_by = ["seating"]
calibres = [".32 S&W Long", ".32 S&W Long Wadcutter"]

[[group]]
differ_by = ["seating"]
calibres = [".38 Special", ".38 Special Wadcutter"]

[[group]]
differ_by = ["rim", "load"]
calibres = ["7x57 mm Mauser", "7x57 mm R", ".275 Rigby"]

[[group]]
differ_by = ["rim"]
calibres = ["6.5x57 mm Mauser", "6.5x57 mm R"]

[[group]]
differ_by = ["rim", "length"]
calibres = ["7x64 mm", "7x65 mm R"]

[[group]]
differ_by = ["rim", "bore"]
calibres = ["8x57 mm IS", "8x57 mm IRS", "8x57 mm I", "8x57 mm IR"]

[[group]]
differ_by = ["rim"]
calibres = [".45 ACP", ".45 Auto Rim"]

[[group]]
differ_by = ["rim"]
calibres = ["5.6x50 mm Magnum", "5.6x50 mm R Magnum"]

[[group]]
differ_by = ["rim"]
calibres = ["5.6x57 mm", "5.6x57 mm R"]

[[group]]
differ_by = ["rim"]
calibres = ["6.5x65 mm RWS", "6.5x65 mm R RWS"]

[[group]]
differ_by = ["rim"]
calibres = ["6.5x68 mm", "6.5x68 mm R"]

[[group]]
differ_by = ["rim"]
calibres = ["8x60 mm S", "8x60 mm RS"]

[[group]]
differ_by = ["rim", "length"]
calibres = ["8x64 mm S", "8x65 mm RS"]

[[group]]
differ_by = ["rim"]
calibres = ["9x57 mm Mauser", "9x57 mm R"]

[[group]]
differ_by = ["rim"]
calibres = ["5.6x61 mm Vom Hofe Super Express", "5.6x61 mm R Vom Hofe Super Express"]

[[group]]
# The .244 Halger is the 6.5x57 mm case necked down; its case is within 0.3 mm of the 6x58 mm Forster's.
differ_by = ["rim", "load"]
calibres = ["6x58 mm Forster", "6x58 mm R Forster", ".244 Halger Magnum"]

[[group]]
differ_by = ["rim"]
calibres = ["6x62 mm Frères", "6x62 mm R Frères"]

[[group]]
differ_by = ["rim"]
calibres = ["6.5x61 mm Mauser", "6.5x61 mm R Mauser"]

[[group]]
differ_by = ["rim"]
calibres = ["8x51 mm Mauser", "8x51 mm R Mauser"]

[[group]]
differ_by = ["rim"]
calibres = ["9.3x53 mm Swiss", "9.3x53 mm R Swiss"]

[[group]]
differ_by = ["bore"]
calibres = ["9x71 mm Peterlongo", "8x71 mm Peterlongo"]

[[group]]
differ_by = ["bore"]
calibres = [".404 Jeffery", "9.5x73 mm Miller-Greiss Magnum"]

[[group]]
differ_by = ["bore"]
calibres = ["9.5x47 mm R", "10.5x47 mm R"]

[[group]]
differ_by = ["length"]
calibres = ["9.3x72 mm R", "9.3x48 mm R", "9.3x57 mm R", "9.3x70 mm R"]

[[group]]
differ_by = ["length"]
calibres = ["10.75x68 mm Mauser", "10.75x63 mm Mauser"]

[[group]]
differ_by = ["bore"]
calibres = ["7.62x54 mm R", "7.62x53 mm R"]

[[group]]
differ_by = ["length"]
calibres = [".450/400 Nitro Express 3 inch", ".450/400 Nitro Express 3¼ inch"]

[[group]]
differ_by = ["ignition"]
calibres = ["10.4x38 mm R Vetterli", "10.4x38 mm R Vetterli Centrefire"]

[[group]]
differ_by = ["ignition"]
calibres = [".44 Henry", ".44 Henry Centrefire"]

[[group]]
differ_by = ["ignition"]
calibres = [".32 Long Rimfire", ".32 Long Centrefire"]

# The Swiss service revolver 1872 was converted to centrefire in 1878 (Ordonnanzrevolver 1872/78).
[[group]]
differ_by = ["ignition", "length"]
calibres = ["10.4 mm Swiss Ordnance 1872 Rimfire", "10.4 mm Swiss Ordnance 1878"]

# The Swiss Match came first (C.I.P. 2002); the 6.5x47 mm Lapua (2005) is a similar case with a
# small rifle primer, a wider neck and the shoulder further forward.
[[group]]
differ_by = ["bore"]
calibres = ["6x47 mm SM", "6.5x47 mm Lapua"]
