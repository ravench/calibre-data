calibres = ["6x58 mm Forster", "6x58 mm R Forster", ".244 Halger Magnum"]

[[group]]
name = "6x62 mm Frères"
differ_by = ["rim"]
calibres = ["6x62 mm Frères", "6x62 mm R Frères"]

[[group]]
name = "6.5x61 mm Mauser"
differ_by = ["rim"]
calibres = ["6.5x61 mm Mauser", "6.5x61 mm R Mauser"]

[[group]]
name = "8x51 mm Mauser"
differ_by = ["rim"]
