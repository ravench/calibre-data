# Calibres that are cartridges of their own but look alike, so an app can show the others from any
# one of them. Each [[group]] has a name (its parent's, or the family's), lists its calibres, the
# parent first, and differ_by, what tells them apart: rim, bore, length, seating, load or ignition
# (see Lookalikes in README.md). A calibre is in one group at most.

[[group]]
name = ".223 Remington"
differ_by = ["load"]
calibres = [".223 Remington", "5.56x45 mm NATO", "5.6 mm GP 90"]

[[group]]
name = ".308 Winchester"
differ_by = ["load"]
calibres = [".308 Winchester", "7.62x51 mm NATO"]

[[group]]
name = ".38 ACP"
differ_by = ["load"]
calibres = [".38 ACP", ".38 Super"]

[[group]]
name = "9x19 mm"
differ_by = ["load"]
calibres = ["9x19 mm", "9 mm Glisenti"]

[[group]]
# Straight rimless 9 mm cases of other lengths: the 9 mm Mauser and the 9 mm Winchester Magnum, which
# COTW 18 likens to the Mauser (p. 480).
name = "9x23 mm Largo"
differ_by = ["load", "length"]
calibres = ["9x23 mm Largo", "9x23 mm Winchester", "9 mm Mauser", "9 mm Winchester Magnum"]

[[group]]
# Cases that measure alike (COTW 18 p. 467). The Mauser and Tokarev rounds are loaded hotter than the
# Borchardt, whose pistols must not fire them (p. 467); Tokarev pistols fire most Mauser loads (p. 466).
# C.I.P. today: 2600 bar for the Mauser, 2500 bar for the Tokarev.
name = "7.63x25 mm"
differ_by = ["load"]
calibres = [".30 Borchardt", "7.63x25 mm Mauser", "7.62x25 mm Tokarev"]

[[group]]
name = ".32 S&W Long"
differ_by = ["seating"]
calibres = [".32 S&W Long", ".32 S&W Long Wadcutter"]

[[group]]
# The .38 AMU (COTW 18 p. 487) is the .38 Special case semi-rimmed, with a flush wadcutter.
name = ".38 Special"
differ_by = ["seating", "rim"]
calibres = [".38 Special", ".38 Special Wadcutter", ".38 AMU"]

[[group]]
name = "7x57 mm"
differ_by = ["rim", "load"]
calibres = ["7x57 mm Mauser", "7x57 mm R", ".275 Rigby"]

[[group]]
# COTW 18 p. 579: the .256 Gibbs is the 6.5x57 mm with a shorter neck.
name = "6.5x57 mm"
differ_by = ["rim", "length"]
calibres = ["6.5x57 mm Mauser", "6.5x57 mm R", ".256 Gibbs Magnum"]

[[group]]
name = "7x64 mm"
differ_by = ["rim", "length"]
calibres = ["7x64 mm", "7x65 mm R"]

[[group]]
name = "8x57 mm"
differ_by = ["rim", "bore"]
calibres = ["8x57 mm IS", "8x57 mm IRS", "8x57 mm I", "8x57 mm IR"]

[[group]]
# The .45 HP is the case 1 mm shorter (COTW 18 p. 514); the .450 SMC takes a small rifle primer
# for a hotter load (p. 517).
name = ".45 ACP"
differ_by = ["rim", "length", "load"]
calibres = [".45 ACP", ".45 Auto Rim", ".45 HP", ".450 SMC"]

[[group]]
name = "5.6x50 mm Magnum"
differ_by = ["rim"]
calibres = ["5.6x50 mm Magnum", "5.6x50 mm R Magnum"]

[[group]]
name = "5.6x57 mm"
differ_by = ["rim"]
calibres = ["5.6x57 mm", "5.6x57 mm R"]

[[group]]
name = "6.5x65 mm RWS"
differ_by = ["rim"]
calibres = ["6.5x65 mm RWS", "6.5x65 mm R RWS"]

[[group]]
name = "6.5x68 mm"
differ_by = ["rim"]
calibres = ["6.5x68 mm", "6.5x68 mm R"]

[[group]]
name = "8x60 mm S"
differ_by = ["rim"]
calibres = ["8x60 mm S", "8x60 mm RS"]

[[group]]
name = "8x64 mm S"
differ_by = ["rim", "length"]
calibres = ["8x64 mm S", "8x65 mm RS"]

[[group]]
name = "9x57 mm"
differ_by = ["rim"]
calibres = ["9x57 mm Mauser", "9x57 mm R"]

[[group]]
name = "5.6x61 mm Vom Hofe Super Express"
