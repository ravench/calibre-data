# The printed books a calibre file can name as a source. A source "book:<id> p. <page>" is the book
# with that id below and the page the value is printed on: the book's own page number, not the
# page of a PDF scan ("book:cotw-18 p. 176" is page 176 of the 18th edition of Cartridges of the
# World). Cite a value with its page; never copy the book's text or tables into this repository.
#
# Each book needs a title and a year; edition, authors, editors, publisher, place and isbn where
# the book has them (books printed before about 1970 have no ISBN).

[cotw-1]
title = "Cartridges of the World"
edition = "1st"
authors = "Frank C. Barnes"
editors = "John T. Amber"
publisher = "The Gun Digest Company"
place = "Chicago"
year = 1965

