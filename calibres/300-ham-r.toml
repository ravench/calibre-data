# SAAMI drawing (Wilson Combat copy, rev. 2022-04-11); case length after the SAAMI datasheet.
name = ".300 HAM'R"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["300hamr", "hamr"]

origin = "US"
origin_sources = ["https://municion.org/producto/300-hamr/"]
# Still made, but hardly ever found:
rare = true

[mm]
# SAAMI 300 HAM'R, maximum cartridge.
# Bullet: .308 in like the .300 AAC Blackout (SAAMI maximum .309 in); shoulder and shoulder_at
# SAAMI's, where the body and shoulder lines meet.
rim = 9.6
base = 9.55
shoulder = 9.26
shoulder_at = 34.06
neck = 8.43
case_length = 40.72
overall_length = 57.4
bullet = 7.82
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=116", "book:cotw-18 p. 452", "https://municion.org/producto/300-hamr/"]

[introduced]
year = 2018
sources = ["https://athlonoutdoors.com/article/wilson-combat-300-hamr-cartridge/"]

[primer]
size = "small-rifle"
sources = ["https://www.starlinebrass.com/300-hamr-brass"]

[shoulder_angle]
# SAAMI: 30 deg (the AECC drawing 08-041-BGC-001 on municion.org gives 27.5).
degrees = 30
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=116"]

[case_head]
# made from .223 Rem. cases; C.I.P. 300 AAC Blackout
rim_thickness = 1.14
ramp_top = 3.15
groove_diameter = 8.43
ramp_angle = 25.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/300-aac-blackout-180801-en.pdf"]

[bullet]
type = "jacketed"
sources = []

[case]
material = "brass"
sources = []
