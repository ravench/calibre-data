# SAAMI drawing (Wilson Combat copy, rev. 2022-04-11); case length after the SAAMI datasheet.
name = ".300 HAM'R"
guns = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["300hamr", "hamr"]

origin = "US"
origin_sources = ["https://municion.org/producto/300-hamr/"]
# Still made, but hardly ever found:
rare = true

[mm]
# SAAMI 300 HAM'R, maximum cartridge.
# Bullet: .308 in like the .300 AAC Blackout (SAAMI maximum .309 in); shoulder and shoulder_at
# SAAMI's, where the body and shoulder lines meet.
rim = 9.6
base = 9.55
shoulder = 9.26
shoulder_at = 34.06
neck_at = 34.78
neck_base = 8.43
# SAAMI: 30 deg (the drawing 08-041-BGC-001 gives 27.5).
shoulder_angle = 30
cite.shoulder_angle = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=116"]
neck = 8.43
case_length = 40.72
overall_length = 57.4
bullet = 7.82
# nose: read to scale off the specimen drawing 08-041-BGC-001:
# the curve starts 12.8 mm behind the tip, of the 13.43 mm out of its case (TL 53.78, CL 40.35).
nose = 12.8
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=116", "book:cotw-18 p. 452", "https://municion.org/producto/300-hamr/"]

[introduced]
year = 2018
sources = ["https://athlonoutdoors.com/article/wilson-combat-300-hamr-cartridge/"]

[primer]
size = "small-rifle"
sources = ["https://www.starlinebrass.com/300-hamr-brass"]

[case_head]
# made from .223 Rem. cases; the C.I.P. 223 Rem. head
rim_thickness = 1.14
ramp_top = 3.13
groove_diameter = 8.43
ramp_angle = 25.0
groove_width = 0.76
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/223-rem-170406-en.pdf"]

[bullet]
type = "jacketed"
sources = []

[case]
# The photo shows a brass case.
material = "brass"
sources = ["https://municion.org/producto/300-hamr/"]
