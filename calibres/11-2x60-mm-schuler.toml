# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# A rimless, rebated smokeless version of the 11 mm Mauser M1871.
name = "11.2x60 mm Schüler"
guns = ["rifle"]
kind = "rimless"
profile = "round"
aliases = ["11.2x60", "11.2x60 schuler", "11.15x59.8"]
display_aliases = ["11.2x60 mm Mauser"]

origin = "DE"
origin_sources = ["book:ammo-encyclopedia-2 p. 456"]
obsolete = true
rare = true

[mm]
rim = 11.81
base = 13.0
shoulder = 13.0
shoulder_at = 34.44
neck = 11.81
case_length = 59.69
overall_length = 72.64
bullet = 11.18
sources = ["book:cotw-18 p. 652", "https://municion.org/producto/112-x-60-schuler/"]

[introduced]
# COTW: right after the First World War, but maybe older.
year = 1919
sources = ["book:cotw-18 p. 649"]

[primer]
# The table gives a .217 in. Berdan primer, within 0.2 mm of the large Boxer size.
size = "large-rifle"
diameter = 5.51
sources = ["book:cotw-18 p. 652"]

[shoulder_angle]
# AECC drawing on municion.org: SØ 12.76, NØ 11.95, SL 35.00, NL 19.10, CL 60.25. The half angle runs between the
# book's diameters over the drawing's shoulder length (6.15 mm): the specimen's own cone (3.8 degrees) would leave a
# neck 2.8 mm shorter than the specimen's, over the 1.5 mm the rule allows.
degrees = 5.5
sources = ["https://municion.org/producto/112-x-60-schuler/"]

[case_head]
# AECC drawing 11-060-BRC-010 (municion.org): RT 1.26, HL 3.90, GØ 10.25, GW 1.46, HØ 13.00; ramp angle from HL = RT +
# GW + ((HØ - GØ)/2)/tan(angle).
rim_thickness = 1.26
ramp_top = 3.9
groove_diameter = 10.25
ramp_angle = 49.0
sources = ["https://municion.org/producto/112-x-60-schuler/"]

[bullet]
type = "softpoint"
sources = ["book:cotw-18 p. 649"]

[case]
material = "brass"
sources = []
