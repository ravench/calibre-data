# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The Sharps Rifle Company's .223 Remington case necked up to .25 for AR-15 rifles.
name = ".25-45 Sharps"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["25-45 sharps", "25-45"]

origin = "US"
origin_sources = ["https://municion.org/producto/25-45-sharps/"]
rare = true

[mm]
rim = 9.6
base = 9.55
shoulder = 8.97
shoulder_at = 36.1
neck = 7.21
case_length = 44.7
overall_length = 54.23
bullet = 6.53
# shoulder_at estimated: a neck one calibre long and the shoulder at the angle below.
unsourced = ["shoulder_at"]
sources = ["book:cotw-18 p. 451"]

[introduced]
year = 2008
sources = ["book:cotw-18 p. 367"]

[primer]
