# Measurements converted from inches.
# A Stevens match round for the New Model Range rifles Nos. 9 and 10.
name = ".32-35 Stevens & Maynard"
guns = ["rifle"]
kind = "rimmed"
# Nose: flat, as the specimen drawing shows it (https://municion.org/producto/32-35-maynard-1882/).
profile = "flat"
aliases = ["32-35", "32-35 stevens", "32-35 maynard"]

origin = "US"
origin_sources = ["https://municion.org/producto/32-35-maynard-1882/"]
obsolete = true
rare = true

[mm]
rim = 12.78
base = 10.21
neck = 8.61
case_length = 47.75
overall_length = 58.17
bullet = 7.92
# flat: the drawing gives the flat tip as Ø 4,00 (whole millimetres).
flat = 4.0
cite.flat = ["https://municion.org/producto/32-35-maynard-1882/"]
sources = ["book:cotw-18 p. 250"]

[introduced]
# COTW: introduced in the mid-1880s; the first rifles it names came out in 1886.
year = 1886
sources = ["book:cotw-18 p. 201"]

[primer]
size = "small-rifle"
sources = ["book:cotw-18 p. 250"]

[case_head]
# .076 in.
rim_thickness = 1.93
sources = ["book:donnelly p. 375"]

[bullet]
type = "lead"
sources = ["book:cotw-18 p. 201"]

[case]
# The photos show brass cases (unmarked ones). municion.org files the round as
# the .32-35 Maynard 1882.
material = "brass"
sources = ["https://municion.org/producto/32-35-maynard-1882/"]
