# Alarm and starter blanks from C.I.P. Tab. VIII, maximum cartridge (sheets 1991-07-29 to
# 1991-08-02). Closed-front ones (8 mm, .315) are plain cylinders like the 9 mm P.A.K., length = L3.
# Star-crimped ones use L6 (the crimped length); their mouth is estimated at 0.6 x the base,
# the ratio of the measured .22 Blank (6.8/11), because C.I.P. gives no crimp size.
name = ".22 Long Knall"
categories = ["rimfire"]
kind = "rimfire"
profile = "crimped"
aliases = ["22longknall", "22langknall", "22longblank", "5.6/16", "5.6x16"]
display_aliases = [".22 lang Knall", "Setzkartusche 5.6/16"]

[mm]
rim = 7.06
base = 5.74
mouth = 3.4
length = 15.0
# No source yet for mouth.
sources = ["https://360.lexisnexis.at/media/attachment/2019_ii_435-coo_2026_100_2_1703759-anlage11/pdf"]

[introduced]
# C.I.P. Tab. VIII sheet dates (1991-07-29 to 1991-08-02); no earlier source found for these blanks.
year = 1991
sources = ["https://360.lexisnexis.at/media/attachment/2019_ii_435-coo_2026_100_2_1703759-anlage11/pdf"]

[case_head]
# R on the C.I.P. 22 Long Blanc sheet
rim_thickness = 1.09
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-viii/tabviiical-en-page3.pdf"]

[case]
material = "brass"
sources = []
