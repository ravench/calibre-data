# The round of the Finnish Lahti L-34 «boat gun» of the Finnish Coastguard, among the least-used service
# cannon rounds. Its name gives the bore and case length, Rapid Fire's table the rim and base, Autocannon
# p. 119 the length of the round, the specimen drawing on municion.org the shoulder, the neck and the
# head.
name = "20x113 mm"
guns = ["cannon"]
kind = "rimless"
profile = "spitzer"
aliases = ["20 mm lahti", "lahti l-34", "lahti l34"]
origin = "FI"
origin_sources = ["book:rapid-fire p. 226"]

[mm]
rim = 28.0
base = 28.0
shoulder = 23.8
shoulder_at = 95.33
neck_at = 102.2
neck_base = 21.25
# Drawing 20-113-BGC-010: SØ 23.80, NØ 21.25, SL 95.30, NL 10.80, CL 112.97, TL 171.37.
# The neck is the drawing's mouth (MØ 21.00), 0.25 mm narrower than where the neck starts (NØ).
shoulder_angle = 10.5
cite.shoulder_angle = ["https://municion.org/producto/20-x-113-lahti-tikkakoski-anti-tank/"]
neck = 21.0
case_length = 113.0
overall_length = 177.0
bullet = 20.0
sources = [
  "book:rapid-fire p. 226",
  "book:autocannon p. 119",
  "https://municion.org/producto/20-x-113-lahti-tikkakoski-anti-tank/",
]

[introduced]
unknown = "Autocannon dates the L-34 only to the mid-1930s."
sources = ["book:autocannon p. 119"]

[case_head]
# The drawing 20-113-BGC-010: RØ 28.06, HØ 27.97, RT 4.03, GØ 22.46, GW 2.95, the ramp
# ends at HL 9.65; ramp angle from HL = RT + GW + ((HØ - GØ)/2)/tan(angle).
rim_thickness = 4.03
ramp_top = 9.65
groove_diameter = 22.46
ramp_angle = 46.0
groove_width = 2.95
sources = ["https://municion.org/producto/20-x-113-lahti-tikkakoski-anti-tank/"]

[case]
material = "brass"
sources = ["book:autocannon p. 119"]
