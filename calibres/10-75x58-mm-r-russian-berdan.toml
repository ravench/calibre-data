# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The Berdan I and II rifles; the first bottlenecked service round with an outside Berdan primer.
name = "10.75x58 mm R Russian Berdan"
# Firearms: book:cotw-18 p. 561.
categories = ["black-powder", "rifle"]
kind = "rimmed"
profile = "round"
aliases = ["10.75x58r", "43 berdan"]
display_aliases = [".43 Russian Berdan"]

origin = "RUE"
origin_sources = [
  "https://municion.org/producto/1075-x-58-r-berdan-n1-n2-russian-m-69-bulgarian-m-71-flat-base/",
]
obsolete = true
rare = true

[mm]
rim = 16.18
base = 14.4
shoulder = 12.85
shoulder_at = 38.45
neck = 11.4
case_length = 56.9
overall_length = 74.93
bullet = 10.92
# shoulder_at from the AECC drawing 11-058-BBC-070 (municion.org): SL 39.00 on a case of CL 57.45, taken from the mouth
# (case_length - (CL - SL)). Donnelly prints the start 0.41 mm later (J 1.53 in. = 38.86). The drawing's shoulder
# and neck diameters are the book's within 0.2 mm; its own cone between the book's diameters would start the neck
# 1.56 mm early, so the angle runs over the drawing's shoulder length.
sources = [
  "book:cotw-18 p. 574",
  "https://municion.org/producto/1075-x-58-r-berdan-n1-n2-russian-m-69-bulgarian-m-71-flat-base/",
  "book:donnelly p. 957",
]

[introduced]
year = 1868
sources = ["book:cotw-18 p. 561"]

[primer]
# 6.42 mm, 10 specimens
size = "berdan-nitro"
sources = [
  "https://municion.org/producto/1075-x-58-r-berdan-n1-n2-russian-m-69-bulgarian-m-71-flat-base/",
  "https://municion.org/producto/1075-x-58-r-berdan-n1-n2-russian-m-69-bulgarian-m-71-mauser-a/",
]

[shoulder_angle]
# The book's shoulder and neck diameters over the shoulder length of the AECC drawing (CL 57.45 - NL 12.20 -
# SL 39.00 = 6.25 mm). Donnelly's lengths (K .240 in.) give 6.8; his printed angles are not used.
degrees = 6.6
sources = ["https://municion.org/producto/1075-x-58-r-berdan-n1-n2-russian-m-69-bulgarian-m-71-flat-base/"]

[case_head]
# .080 in. (COTW); the AECC drawing 11-058-BBC-070 (municion.org) has RT 2.30.
rim_thickness = 2.03
sources = ["book:cotw-18 p. 574"]

[bullet]
# The military load: a paper-patched lead bullet over blackpowder.
type = "paper"
sources = ["book:cotw-18 p. 561"]

[case]
material = "brass"
sources = []
