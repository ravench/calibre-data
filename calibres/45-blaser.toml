# Measurements from the C.I.P. sheet (maximum cartridge).
# A boar round for short Blaser actions: rebated rim and a long neck.
name = ".45 Blaser"
guns = ["rifle"]
kind = "rimless"
profile = "round"
aliases = ["45blaser", "45 blaser"]

origin = "DE"
origin_sources = ["https://municion.org/producto/45-blaser/"]
rare = true

[mm]
# C.I.P. 45 Blaser, maximum cartridge: rim R1, base P1, shoulder P2 at L1, neck H2, case L3, length L6, bullet G1.
rim = 12.01
base = 13.03
shoulder = 12.98
shoulder_at = 40.74
neck = 12.36
case_length = 55.0
overall_length = 68.5
bullet = 11.64
sources = [
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-i/45-blaser-220214-en.pdf",
  "book:cotw-18 p. 652",
]

[introduced]
# naboje.org: developed in Germany in 2001; COTW 18 p. 649 gives no year.
year = 2001
sources = ["book:cotw-18 p. 649", "https://naboje.org/node/5401"]

[primer]
# The table gives a large Boxer primer.
size = "large-rifle"
sources = ["book:cotw-18 p. 652"]

[shoulder_angle]
# C.I.P. 45 Blaser: half the cone angle alpha 19°58'44"
degrees = 10.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/45-blaser-220214-en.pdf"]

[case_head]
# C.I.P. 45 Blaser: R, E, E1, delta
rim_thickness = 1.37
ramp_top = 4.39
groove_diameter = 10.39
ramp_angle = 36.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/45-blaser-220214-en.pdf"]

[bullet]
type = "softpoint"
sources = ["book:cotw-18 p. 649"]

[case]
material = "brass"
sources = []
