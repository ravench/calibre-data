# Batch 8 (2026-11); now from the C.I.P. sheet (see [mm]).
name = ".35 Winchester Self-Loading"
guns = ["rifle"]
kind = "semi-rimmed"
# Nose: flat, as the AECC specimen drawing shows it (https://municion.org/producto/35-winchester-self-loading/).
profile = "flat"
aliases = ["35wsl", "35 win. sl"]

origin = "US"
origin_sources = [
  "book:ammo-encyclopedia-2 p. 416",
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page87.pdf",
]
obsolete = true
rare = true

[mm]
# C.I.P. 35 Win. SL, maximum cartridge: rim R1, base P1, neck H2, case L3, length L6, bullet G1.
rim = 10.29
base = 9.68
neck = 9.58
case_length = 29.31
overall_length = 41.91
bullet = 8.95
