# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The US Navy's round for the Lee straight-pull rifle of 1895, made by Winchester; no factory ammunition
# since 1935.
name = "6 mm Lee Navy"
categories = ["rifle"]
kind = "rimless"
profile = "round"
aliases = ["6mm lee navy", "236 navy", "6mm lee"]

origin = "US"
origin_sources = [
  "https://en.wikipedia.org/wiki/6mm_Lee_Navy",
  "book:ammo-encyclopedia-2 p. 499",
]
obsolete = true
rare = true

[mm]
rim = 11.38
base = 11.3
shoulder = 10.21
shoulder_at = 43.75
neck = 7.06
case_length = 59.69
overall_length = 78.99
bullet = 6.2
sources = ["book:cotw-18 p. 249", "https://municion.org/producto/6-mm-us-lee-navy/"]

[introduced]
year = 1895
sources = ["book:cotw-18 p. 186"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 249"]

[shoulder_angle]
