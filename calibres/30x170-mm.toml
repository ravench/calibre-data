# The round of Hispano-Suiza's HS 830 and HS 831 anti-aircraft cannon, called the Oerlikon KCB since
# 1971, and of the British Rarden. Autocannon traces it to the French HS 411 project of 1939/40: a
# few lots were made in Britain in 1942, and Hispano-Suiza's Swiss arm developed it into the HS 830
# and HS 831, in service from the 1950s (p. 144). Its name gives the bore and case length, Jane's
# table the rim, base and neck, its p. 105 the length of the round, the specimen drawing on
# municion.org the shoulder and the head. The drawing's neck (NØ 31.21) is 0.29 mm narrower than
# Jane's (31.5), more than the 0.15 mm a neck may widen towards its mouth, so the file has no neck_at
# or neck_base.
# The case is steel (HS 831L, KCB) or brass (HS 831A, Rarden): the file names no material.
name = "30x170 mm"
guns = ["cannon"]
kind = "rimless"
profile = "spitzer"
aliases = ["30x170", "30 mm rarden", "30 mm kcb", "30 mm oerlikon kcb", "hs 831"]
origin = "CH"
origin_sources = [
  "https://municion.org/producto/30-x-170-swiss-hispano-hs-830-831l-british-rarden-kcb/",
  "book:rapid-fire p. 228",
]

