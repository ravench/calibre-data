# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# A changed .378 Weatherby Magnum case, short enough for a .375 H&H magazine.
name = ".375 A-Square"
kind = "belted"
profile = "spitzer"
aliases = ["375 a-square", "375 a-sq"]

origin = "US"
rare = true

[mm]
rim = 14.7
base = 14.78
shoulder = 14.0
shoulder_at = 59.9
neck = 10.29
case_length = 72.39
overall_length = 92.71
bullet = 9.52
# The table gives the belt, .603 in., in the rim column; the rim is the .378 Weatherby Magnum's (R1 on its
# C.I.P. sheet), as the belt is drawn at the rim diameter.
# No source yet for shoulder_at (estimated: a neck one calibre long and the shoulder at 32 degrees).
sources = ["book:cotw-18 p. 452", "https://bobp.cip-bobp.org/uploads/tdcc/tab-iii/tabiiical-en-page29.pdf"]

[introduced]
year = 1975
sources = ["book:cotw-18 p. 415"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 452"]

[case_head]
# from the .378 Weatherby Magnum case; C.I.P. sheet
rim_thickness = 1.6
ramp_top = 6.4
groove_diameter = 12.57
ramp_angle = 45.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-iii/tabiiical-en-page29.pdf"]

[bullet]
# Inferred: A-Square's factory load took Sierra bullets and its own three Triad types; the page names
# no type (p. 416).
type = "softpoint"
sources = []

[case]
material = "brass"
sources = []
