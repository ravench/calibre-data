# Measurements from the C.I.P. sheet (maximum cartridge).
# Remington's factory version of the 6 mm BR. C.I.P. gives the 6 mm BR Norma the same case with a
# longer overall length.
name = "6 mm BR Remington"
kind = "rimless"
profile = "spitzer"
aliases = ["6mm br remington", "6mm br rem", "6mmbrrem"]

origin = "US"
obsolete = true
rare = true

[mm]
rim = 12.01
base = 11.96
shoulder = 11.68
shoulder_at = 27.3
neck = 6.87
case_length = 39.62
overall_length = 55.88
bullet = 6.18
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page13.pdf"]

[introduced]
# COTW: Mike Walker of Remington standardised it in 1978; .308x1½ in. cases necked to 6 mm go
# back to 1962-63.
year = 1978
sources = ["book:cotw-18 p. 185"]

[primer]
size = "small-rifle"
sources = ["book:cotw-18 p. 249"]

[shoulder_angle]
# Half the cone angle alpha on the C.I.P. sheet.
degrees = 30.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page13.pdf"]

[case_head]
# R and the extractor groove on the C.I.P. sheet.
rim_thickness = 1.37
ramp_top = 3.85
groove_diameter = 10.39
ramp_angle = 36.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page13.pdf"]

[bullet]
type = "jacketed"
sources = []

[case]
material = "brass"
sources = []
