# GP 1890: the round of the Schmidt-Rubin IG 89. The Federal Council decided on 1 July 1890 (minutes
# Nr. 2719, Federal Archives 70007611, PDF p. 18) that the «Munition zu dem Gewehr Modell 1889» gets
# a hard-lead bullet with a steel cap and a paper patch, without naming the cartridge; its reports
# of 1890-92 say «7,5 mm Patronen» and «Patronen zum Gewehr Modell 89». The first official model
# name is «Gewehrpatrone 1890/1903» (decision of 6 March 1903, Nr. 912, 70009162, PDF p. 7), still
# «Gewehrpatronen 90/03» in the report for 1923. «GP 90» and «GP 1890» are later short forms
# (swisswaffen; FCHM: «7,5 mm GP Modell 1890 (Ordonnanz 1889)»). The army's own drawing is «Patrone,
# Modell 1890» (Eidg. Munitionsfabrik Thun, 1 February 1892; Federal Archives E27#1000/721#18612*,
# scan 4). Its bullet is unusual: a hard-lead body wrapped in paper (the white band above the case
# mouth) and a long, blunt round nose under a steel cap (drawing: 13.8 g, 29.0 mm long, 8.15 mm at
# most, 8.35 at the paper's base; the cap 7.8). Not to be confused with the 5.6 mm GP 90 of the Stgw
# 90.
# Versions: the GP 90/03 (decision of 6 March 1903) got a less corrosive primer: the request of 26
# Feb 1903 (same dossier, scans 419-420) changes only the primer (brass cup, Ziegler's «Zündsatz
# IV»); from 1901 the army re-primed its stocks in Thun and Altdorf (reports for 1901-03), so many
# are 1890 cases with a new primer. It kept the 53.5 mm case (Poyer p. 50, 54; swisswaffen; FCHM;
# swissrifles.com). The case was changed in details until 1903 (FCHM). From 1923 the GP 90/23 had a
# 1 mm longer case and a jacketed bullet: its own calibre, 7.5x54.5 mm Swiss (GP 90/23), like the
# Kadettenpatrone.
# Case: the 1892 drawing gives case 53.5 (54.8 before necking), rim 12.5 and 1.6 thick, 12.4 in
# front of the groove, shoulder 11.5 at 44.5 from the head, neck 8.85 at its base and 8.5 at the
# mouth (7 long), cartridge 77.2 (+0.5/-0.2), all values below. Its extractor groove is a curved
# cove (10.2 across, radius 1.5), so no ramp angle. Its primer is a Berdan cap, 4.92 across, on an
# anvil in the case with two flash holes. swissrifles.com/ammo (http only, so not a listed source)
# gives 2.106 in (53.5) case, .492 in (12.5) rim and .488 in (12.4) head for the GP 90 and 90/03,
# Poyer p. 50 gives 7.5x53.5; Raven's paper-patched GP round of June 1906 (headstamp «6 T T 06»)
# measures 53.5 (re-measured 2026-11-11; 54.6 noted on 2026-11-08 was a misreading) and 76.0 long.
# The AECC drawing (municion.org, «M.1890-1903») has head to shoulder 44.24 and a 27.8° shoulder.
# C.I.P. has no sheet. Cartridges of the World (14th ed., 2014) has one entry for the whole family,
# under the 7.5x55 name with GP 11 measurements. It keeps GP 11 apart by its bigger bullet (.308 for
# .299) and stronger load, which the 1889 rifle must not fire.
name = "7.5x53.5 mm Swiss (GP 1890)"
kind = "rimless"
profile = "patched"
aliases = ["gp1890", "gp 1890", "gp1890/03", "gp90/03", "gp 90/03", "7.5 mm gp 90", "7.5 mm gp 90/03", "patrone 1890", "gewehrpatrone 1890", "7.5 mm gewehrpatrone 90", "gewehrpatrone 1890/1903", "gp modell 1890", "modell 1890", "patrone modell 1890", "7.5x53.5", "7.5x53", "schmidt-rubin", "ig89"]
display_aliases = ["GP 1890", "GP 90/03"]

origin = "CH"
obsolete = true

[mm]
rim = 12.5
base = 12.4
shoulder = 11.5
shoulder_at = 44.5
neck = 8.5
case_length = 53.5
overall_length = 77.2
bullet = 8.15
sources = ["https://www.recherche.bar.admin.ch/recherche/link/de/archiv/einheit/1445321", "book:poyer p. 50", "https://municion.org/producto/75-x-535-swiss-schmidt-rubin-m-1890-1903/"]

[introduced]
# Federal Council decision of 1 July 1890 (minutes Nr. 2719, PDF p. 18); first 148,500 rounds made in
# 1890 (report for 1890, 50000156, p. 776)
year = 1890
sources = ["https://www.amtsdruckschriften.bar.admin.ch/viewOrigDoc/70007611.pdf?id=70007611", "https://www.amtsdruckschriften.bar.admin.ch/viewOrigDoc/50000156.pdf?id=50000156"]

[primer]
# The 1892 drawing has a 4.92 mm Berdan cap, drawn at its own diameter on the large rifle size.
size = "large-rifle"
diameter = 4.92
sources = ["https://en.wikipedia.org/wiki/7.5×55mm_Swiss", "https://www.recherche.bar.admin.ch/recherche/link/de/archiv/einheit/1445321"]

[shoulder_angle]
# From the 1892 drawing: 11.5 down to 8.85 over 2 mm, atan(1.325 / 2) (the AECC drawing has 27.8)
degrees = 33.5
sources = ["https://www.recherche.bar.admin.ch/recherche/link/de/archiv/einheit/1445321"]

[case_head]
# 1892 drawing; the groove is a curved cove with no ramp angle, so no groove keys
rim_thickness = 1.6
sources = ["https://www.recherche.bar.admin.ch/recherche/link/de/archiv/einheit/1445321"]

[bullet]
# Paper: the lead body wrapped in paper (see above); profile = "patched" draws its steel cap.
type = "paper"
sources = ["https://www.recherche.bar.admin.ch/recherche/link/de/archiv/einheit/1445321"]

[case]
material = "brass"
sources = []

[fired_by]
firearms = ["Schmidt-Rubin M1889"]
sources = ["https://en.wikipedia.org/wiki/7.5×55mm_Swiss"]
