profile = "patched"
aliases = ["gp1890", "gp 1890", "gp1890/03", "gp90/03", "gp 90/03", "7.5 mm gp 90", "7.5 mm gp 90/03", "patrone 1890", "gewehrpatrone 1890", "7.5 mm gewehrpatrone 90", "gp modell 1890", "modell 1890", "7.5x53.5", "7.5x53", "schmidt-rubin", "ig89"]
display_aliases = ["GP 1890", "GP 90/03"]

origin = "CH"
