# GP 1890: «7,5 mm Gewehrpatrone 90», adopted by the Federal Council on 1 July 1890 with the
# Schmidt-Rubin IG 89 (FCHM: «7,5 mm GP Modell 1890 (Ordonnanz 1889)»; swisswaffen). The «GP» names
# are the army's later short forms. Its bullet is unusual: a lead body wrapped in two turns of paper (the
# white band above the case mouth) and a long, blunt round nose under a steel cap (13.7 g, 29 mm long,
# 7.8 mm over the paper). Not to be confused with the 5.6 mm GP 90 of the Stgw 90.
# Versions: the GP 90/03 (decision of 6 March 1903) only got a less corrosive primer and kept the
# 53.5 mm case (Poyer p. 50, 54; swisswaffen; FCHM; swissrifles.com). The case was changed in details
# until 1903 (FCHM). From 1923 the GP 90/23 had a 1 mm longer case and a jacketed bullet: its own calibre,
# 7.5x54.5 mm Swiss (GP 90/23), like the Kadettenpatrone.
# Case: swissrifles.com/ammo (http only, so not a listed source) gives 2.106 in (53.5) case,
# .492 in (12.5) rim and .488 in (12.4) head for the GP 90 and 90/03, Poyer p. 50 gives 7.5x53.5; Raven's paper-patched GP round of June 1906 (headstamp «6 T T 06») measures
# 53.5 (re-measured 2026-11-11; 54.6 noted on 2026-11-08 was a misreading) and 76.0 long. Head to
# shoulder 44.24 and the shoulder angle are the AECC drawing's (municion.org, «M.1890-1903»).
# C.I.P. has no sheet. Cartridges of the World (14th ed., 2014) has one entry for the whole family,
# under the 7.5x55 name with GP 11 measurements. It keeps GP 11 apart by its bigger bullet (.308 for
# .299) and stronger load, which the 1889 rifle must not fire.
name = "7.5x53.5 mm Swiss (GP 1890)"
