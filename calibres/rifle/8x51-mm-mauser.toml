origin = "DE"
obsolete = true
rare = true

[mm]
rim = 11.95
base = 11.95
shoulder = 11.15
shoulder_at = 38.09
neck = 8.97
case_length = 50.7
overall_length = 68.0
bullet = 8.07
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page54.pdf"]

[introduced]
