# Rigby's name for the 7x57, but C.I.P. gives the "275 H.V. Rigby" its own sheet (in SHOULDER_ANGLES) at
# 3200 bar against the 7x57's 3900, so 7x57 ammunition is too hot for its guns: its own calibre (2026-11-08).
name = ".275 Rigby"
kind = "rimless"
# Nose: round soft point (photo, COTW 18 p. 580).
profile = "round"
# Today: pointed, Hornady's 140-grain InterLock SP (https://www.hornady.com/ammunition/rifle/275-rigby-140-gr-interlock-sp).
profile_today = "spitzer"
aliases = ["275rigby", "275hvrigby", "275bore"]

origin = "GB"
# Lookalike variants added 2026-11-08, judged without listing counts: rimmed twins of rare or old rounds,
# the old J-bore 8x57s, the Finnish 7.62x53 R, the .450/400 3 1/4 inch and the .275 Rigby.
rare = true

[mm]
rim = 12.06
base = 12.04
shoulder = 10.87
shoulder_at = 43.79
neck = 8.23
case_length = 56.9
overall_length = 77.98
bullet = 7.21
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page101.pdf"]

[introduced]
# Lookalike variants (2026-11-08).
# municion gives "1900's": earliest wins
year = 1900
