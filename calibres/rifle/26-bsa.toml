# Measurements from Donnelly's Handloader's Manual of Cartridge Conversion and Cartridges of the
# World, 5th ed. (inches converted to mm): COTW 18's row (p. 608) repeats the .242 Rimless row.
# BSA's belted round for its sporting rifles on the 1914 Enfield action. The table types it rimless;
# the entry and its other name say belted.
name = ".26 BSA"
kind = "belted"
profile = "spitzer"
aliases = ["26 bsa", "26bsa"]
display_aliases = [".26 Rimless Belted Nitro Express"]

origin = "GB"
obsolete = true
rare = true

[mm]
rim = 13.46
base = 13.03
shoulder = 11.68
shoulder_at = 48.01
neck = 7.75
case_length = 60.71
overall_length = 79.5
bullet = 6.78
# The overall length from COTW 5, the rest from Donnelly.
sources = ["book:donnelly p. 245", "book:cotw-5 p. 266"]

[introduced]
year = 1921
sources = ["book:cotw-18 p. 580"]

[primer]
# COTW 5 gives a .217 in. Berdan primer, within 0.2 mm of the large Boxer size.
size = "large-rifle"
diameter = 5.51
sources = ["book:cotw-5 p. 266"]

[case_head]
# .049 in.
rim_thickness = 1.24
sources = ["book:donnelly p. 245"]

[bullet]
type = "softpoint"
sources = ["book:cotw-18 p. 580"]

[case]
material = "brass"
sources = []
