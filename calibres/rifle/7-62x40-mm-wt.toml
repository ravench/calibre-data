# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Wilson Combat's .30 round for AR-15 rifles, from Kurt Buchert's 7.62x40 USA: the 5.56x45 mm case shortened
# and necked up. COTW 18 p. 249: the factory load is no longer made.
name = "7.62x40 mm WT"
kind = "rimless"
profile = "spitzer"
aliases = ["7.62x40 wt", "7.62x40 wilson tactical", "7.62x40 usa", "7.62x40"]

origin = "US"
obsolete = true
rare = true

[mm]
rim = 9.52
base = 9.55
shoulder = 9.27
shoulder_at = 31.1
neck = 8.25
case_length = 39.75
overall_length = 57.4
bullet = 7.82
# No source yet for shoulder_at (estimated: a neck one calibre long and the shoulder at 32 degrees).
sources = ["book:cotw-18 p. 252"]

[introduced]
year = 2011
sources = ["book:cotw-18 p. 248"]

[primer]
# The table gives Bx, a Boxer primer without its size; small rifle, as in the 5.56x45 mm
# case it is made from.
size = "small-rifle"
sources = []

[case_head]
# from the 5.56x45 mm case; the .223 Rem. head, C.I.P. 300 AAC Blackout
rim_thickness = 1.14
ramp_top = 3.15
groove_diameter = 8.43
ramp_angle = 25.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/300-aac-blackout-180801-en.pdf"]

[bullet]
type = "polymer"
sources = ["book:cotw-18 p. 249"]

[case]
material = "brass"
sources = []
