# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The straight 9.3 mm R family differs only in case length.
name = "9.3x48 mm R"
kind = "rimmed"
profile = "round"
aliases = ["9.3x48r"]

origin = "DE"
obsolete = true
rare = true

[mm]
rim = 12.5
base = 11.0
neck = 9.7
case_length = 48.01
overall_length = 59.69
bullet = 9.55
sources = ["book:cotw-18 p. 652"]

[introduced]
# COTW: the 1890s, first with blackpowder; the decade's first year is kept.
year = 1890
sources = ["book:cotw-18 p. 644"]

[primer]
# The table gives a .254 in. Berdan primer.
size = "berdan-nitro"
sources = ["book:cotw-18 p. 652"]

[bullet]
# COTW: old catalogues list one bullet for the whole family; the 9.3x72 mm R's is a soft point.
type = "softpoint"
sources = ["book:cotw-18 p. 644", "https://municion.org/producto/93-x-72-r/"]

[case]
material = "brass"
sources = []
