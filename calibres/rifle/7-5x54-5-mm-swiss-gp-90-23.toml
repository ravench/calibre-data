# GP 90/23: «7,5 mm Gewehrpatrone 90/23» («Scharfe Patrone 90/23» on older boxes), adopted by the Federal
# Council on 9 January 1923 (swisswaffen). The GP 1890 round reworked: a 1 mm longer case, a jacketed
# round-nose bullet (190 gr) and smokeless powder, so the reserve's unaltered IG 89 rifles had a jacketed
# round (Poyer p. 54). It also fires in rifles chambered for GP 11 (FCHM; swisswaffen). Made by the
# Solothurn cartridge factory, designed at Thun (FCHM).
# Case: swissrifles.com/ammo (http only, so not a listed source) gives 2.15 in (54.6) case,
# .500 in (12.7) rim, .496 in (12.6) head and a .3075 in (7.8) bullet; Poyer p. 50 gives 7.5x54.5. Shoulder, neck and head to shoulder are Raven's
# caliper values for the Kadettenpatrone (same case, 1964). Length is an estimate: no source gives it.
