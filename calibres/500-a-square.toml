# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Arthur Alphin's first A-Square round: the .460 Weatherby Magnum case
# necked up and blown out.
name = ".500 A-Square"
categories = ["rifle"]
kind = "belted"
profile = "round"
aliases = ["500 a-square", "500 a-sq"]

origin = "US"
origin_sources = ["https://municion.org/producto/500-a-square-belted-type-2/"]
rare = true

[mm]
rim = 14.7
base = 14.78
shoulder = 14.43
shoulder_at = 62.89
neck = 13.61
case_length = 73.66
overall_length = 95.0
bullet = 12.95
# The table gives the belt, .603 in., in the rim column; the rim is the .460 Weatherby Magnum's (R1 on its
# C.I.P. sheet); the belt is in [case_head].
sources = [
  "book:cotw-18 p. 453",
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-iii/tabiiical-en-page37.pdf",
  "https://municion.org/producto/500-a-square-belted-type-2/",
]

[introduced]
# COTW: designed in 1974; the A-Square company was founded for it in 1979.
year = 1974
sources = ["book:cotw-18 p. 443"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 453"]

[shoulder_angle]
# AECC drawing on municion.org: SØ 14.40, NØ 13.47, SL 62.50, NL 9.40, CL 73.27.
degrees = 18.7
sources = ["https://municion.org/producto/500-a-square-belted-type-2/"]

[case_head]
# from the .460 Weatherby Magnum case; C.I.P. sheet. The belt (R3 15.33; .603 in. in Cartridges of the World)
# is wider than the rim.
rim_thickness = 1.6
ramp_top = 6.4
groove_diameter = 12.57
ramp_angle = 45.0
belt_diameter = 15.33
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-iii/tabiiical-en-page37.pdf"]

[bullet]
# Inferred: the page gives only A-Square's handloads, with soft points (p. 443).
type = "softpoint"
sources = []

[case]
material = "brass"
sources = []
