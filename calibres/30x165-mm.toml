# The Soviet 30 mm case of the GSh-6-30 aircraft and AK-630 naval guns (electric primer) and the
# 2A42 (percussion primer): the two loadings do not interchange. Its name gives the bore and case
# length (Jane's p. 97 and Koll measure the 2A42 case at 164 mm, Jane's p. 98 the AK-630 case at
# 165 mm), Rapid Fire's table the rim and base, Jane's and Koll the length of the 2A42 and AO-18
# rounds (Koll gives 289.5 to 291.0 mm), the AECC specimen drawing of a 2A42 round on municion.org
# (titled 30 x 164) the shoulder, the neck and the head.
name = "30x165 mm"
categories = ["cannon"]
kind = "rimless"
profile = "spitzer"
aliases = ["30x165"]
origin = "SU"
origin_sources = ["https://en.wikipedia.org/wiki/Shipunov_2A42"]

[mm]
rim = 40.0
base = 40.0
shoulder = 37.72
shoulder_at = 134.44
neck = 31.58
case_length = 165.0
overall_length = 291.0
bullet = 30.0
sources = [
  "book:rapid-fire p. 228",
  "book:janes-ammo-2002 p. 97",
  "book:janes-ammo-2002 p. 98",
  "book:koll p. 281",
  "book:koll p. 298",
  "https://en.wikipedia.org/wiki/Shipunov_2A42",
  "https://municion.org/producto/30-x-164-russian-ao-18-for-2a38m-2a42-2a732-army-guns/",
]

[introduced]
year = 1975
sources = ["https://en.wikipedia.org/wiki/Gryazev-Shipunov_GSh-6-30"]

[shoulder_angle]
# AECC drawing 30-164-BGC-020 on municion.org: SØ 37.72, NØ 31.58, SL 134.30, NL 21.15, CL 164.86, TL 291.03.
# The drawing of the naval round (30-164-BGE-010) agrees: SØ 37.68, NØ 31.82, SL 134.00, NL 21.60, CL 164.75.
degrees = 18.1
sources = ["https://municion.org/producto/30-x-164-russian-ao-18-for-2a38m-2a42-2a732-army-guns/"]

[case_head]
# The AECC drawing 30-164-BGC-020 (municion.org): RØ 39.92, HØ 39.92, RT 4.53, GØ 34.34, GW 3.40,
# the ramp ends at HL 10.95; ramp angle from HL = RT + GW + ((HØ - GØ)/2)/tan(angle).
rim_thickness = 4.53
ramp_top = 10.95
groove_diameter = 34.34
ramp_angle = 43.0
sources = ["https://municion.org/producto/30-x-164-russian-ao-18-for-2a38m-2a42-2a732-army-guns/"]

[case]
# Lacquered or zinc-plated steel (2A42); coated steel for the aircraft guns.
material = "steel"
sources = ["book:janes-ammo-2002 p. 96", "book:janes-ammo-2002 p. 99"]
