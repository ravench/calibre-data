# The Soviet round of the VYa-23 aircraft cannon: a brass case with a screwed-in percussion primer.
# The ZU-23-2's round on the same case (23x152 mm B ZU-23) does not interchange with it (Jane's).
# The name gives the bore and case length, the Wikipedia infobox the cartridge length and the AECC
# specimen drawing of a VYa round on municion.org the diameters (RØ, LØ, HØ, SØ, NØ), the shoulder
# and the head: its belt (LØ 34.64) is what the infobox calls the rim, its rim (RØ 33.38) what the
# infobox gives as the rim's thickness (33.4).
name = "23x152 mm B VYa"
categories = ["cannon"]
kind = "belted"
profile = "spitzer"
aliases = ["23x152b", "23x152", "23 mm vya"]
origin = "SU"
origin_sources = ["https://en.wikipedia.org/wiki/23%C3%97152mmB"]

