# The Soviet round of the VYa-23 aircraft cannon and, with a steel case and a different headspace,
# of the ZU-23-2 anti-aircraft gun: the two loadings do not interchange. The name gives the bore and
# case length, the Wikipedia infobox the cartridge length and the AECC specimen drawing on
# municion.org (a ZU-23 round) the diameters, the shoulder and the head: its belt (LØ 34.57) is what
# the infobox calls the rim, and its rim (RØ 33.33) what the infobox gives as the rim's thickness.
name = "23x152 mm B"
categories = ["cannon"]
kind = "belted"
profile = "spitzer"
aliases = ["23x152b", "23x152", "23 mm zu-23"]
origin = "SU"
origin_sources = ["https://en.wikipedia.org/wiki/23%C3%97152mmB"]

[mm]
rim = 33.33
belt = 34.57
base = 33.24
shoulder = 31.65
shoulder_at = 112.04
neck = 23.73
case_length = 152.0
overall_length = 235.6
bullet = 23.0
sources = [
  "https://municion.org/producto/23-x-152-b-russian-zu-or-zsu-anti-aircraft/",
  "https://en.wikipedia.org/wiki/23%C3%97152mmB",
]

[introduced]
year = 1941
sources = ["https://en.wikipedia.org/wiki/Volkov-Yartsev_VYa-23"]

[shoulder_angle]
# AECC drawing 23-152-BFC-010 on municion.org: SØ 31.65, NØ 23.73, SL 111.25, NL 19.40, CL 151.21.
degrees = 10.9
sources = ["https://municion.org/producto/23-x-152-b-russian-zu-or-zsu-anti-aircraft/"]

[case_head]
# The AECC drawing 23-152-BFC-010 (municion.org): RT 3.88, GØ 27.80, GW 2.20, LØ 34.57, the ramp
# ends at HL 9.70, the belt (LW 2.25) ends at 11.95; ramp angle from HL = RT + GW + ((LØ - GØ)/2)/tan(angle).
rim_thickness = 3.88
ramp_top = 11.95
groove_diameter = 27.8
ramp_angle = 43.0
sources = ["https://municion.org/producto/23-x-152-b-russian-zu-or-zsu-anti-aircraft/"]

[case]
# Brass for the VYa-23, the first gun; steel for the ZU-23 (see [current_cases]).
material = "brass"
sources = ["book:janes-ammo-2002 p. 91"]

[current_cases]
materials = ["steel"]
sources = ["book:janes-ammo-2002 p. 91"]
