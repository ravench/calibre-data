# Measurements converted from inches.
# For the Winchester single-shot, to compete with the big Sharps rounds; the bullet was
# copper-tubed.
name = ".40-110 Winchester Express"
guns = ["rifle"]
kind = "rimmed"
profile = "round"
aliases = ["40-110", "40-110 winchester", "40 express"]

origin = "US"
origin_sources = ["book:ammo-encyclopedia-2 p. 437"]
obsolete = true
rare = true

[mm]
rim = 16.54
base = 14.35
shoulder = 12.32
shoulder_at = 60.45
neck_at = 65.65
neck_base = 11.09
# Drawing: SØ 12.20, NØ 11.09, SL 60.50, NL 16.90, CL 82.60. The half angle runs between the
# book's diameters over the drawing's shoulder length (5.20 mm): the specimen's own cone (6.1 degrees) would leave a
# neck 1.6 mm shorter than the specimen's, over the 1.5 mm the rule allows.
shoulder_angle = 7.9
cite.shoulder_angle = ["https://municion.org/producto/40-110-winchester-express-3-1-4/"]
neck = 10.87
case_length = 82.55
overall_length = 92.2
bullet = 10.24
# COTW 5 prints the base as .543 in.; the 18th edition's .565 in. is kept.
sources = ["book:cotw-18 p. 251", "https://municion.org/producto/40-110-winchester-express-3-1-4/"]

[introduced]
year = 1886
sources = ["book:cotw-18 p. 221"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 251"]

[case_head]
# .06 in.
rim_thickness = 1.52
sources = ["book:donnelly p. 510"]

[bullet]
# Lead: the copper-tubed bullet, a lead bullet with a copper tube in its nose (COTW 18 p. 221); the
# load table's "SP" (p. 222) is not a jacketed bullet.
type = "lead"
sources = ["book:cotw-18 p. 221"]

[case]
# The photos show brass cases (Winchester's and UMC's).
material = "brass"
sources = ["https://municion.org/producto/40-110-winchester-express-3-1-4/"]
