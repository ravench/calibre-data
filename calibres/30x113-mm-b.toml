# The round of the ADEN Mk 4 and later aircraft cannon (the earlier ADEN marks had 30x86 B and
# 30x111 B cases) and of the French DEFA. Its name gives the bore and case length (Jane's table
# measures the case at 111.99 mm); KNDS gives the cartridge length, Jane's table the rim, the belt
# and the neck, the AECC specimen drawing of a DEFA round on municion.org the base (HØ) and the head.
name = "30x113 mm B"
guns = ["cannon"]
kind = "belted"
profile = "spitzer"
aliases = ["30x113b", "30 mm aden", "30 mm defa"]
origin = "GB"
origin_sources = []

[mm]
rim = 33.3
belt = 33.78
base = 32.0
neck = 30.87
case_length = 113.0
overall_length = 200.0
bullet = 30.0
