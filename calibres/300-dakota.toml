# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The .404 Jeffery case shortened for a .30-06-length action, with a slightly larger rim.
# Dakota Arms became Parkwest Arms in 2021 (COTW 18 p. 393).
name = ".300 Dakota"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["300 dakota"]

origin = "US"
origin_sources = ["https://municion.org/producto/300-dakota/"]
rare = true

[mm]
rim = 13.82
base = 13.82
shoulder = 13.49
shoulder_at = 53.21
neck = 8.59
case_length = 64.77
overall_length = 84.58
bullet = 7.82
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/300-dakota/"]

[introduced]
# Ballistic Studies: Don Allen brought out his Dakota rounds in 1992; COTW gives no year.
year = 1992
sources = ["https://www.ballisticstudies.com/Knowledgebase/Dakota+proprietary+cartridges.html"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 452"]

[shoulder_angle]
# AECC drawing on municion.org: SØ 13.41, NØ 8.54, SL 53.00, NL 6.60, CL 64.56.
degrees = 26.1
sources = ["https://municion.org/producto/300-dakota/"]

[case_head]
# .046 in.
