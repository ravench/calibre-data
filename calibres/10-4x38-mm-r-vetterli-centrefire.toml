# The centrefire version of the Vetterli case: many Swiss Vetterli rifles went to the civil market
# converted by changing only the firing pin. Georg Egestorff (Linden), RWS and Gévelot loaded it,
# and commercial ammunition was made into the early 1940s (municion.org). The Egestorff specimen has
# a brass case and a paper-patched lead bullet (its municion.org sheet, under [bullet]). Same case as
# the rimfire original, so the same measurements.
name = "10.4x38 mm R Vetterli Centrefire"
# Guns: book:cotw-18 p. 561.
guns = ["rifle"]
black_powder = true
kind = "rimmed"
profile = "round"
aliases = ["vetterlicf", "10.4cf", "10.4x38cf", "41swisscf"]

origin = "CH"
origin_sources = ["https://municion.org/producto/104-x-38-r-swiss-vetterli-cf-m-1869-81/"]
obsolete = true
rare = true

[mm]
rim = 15.7
base = 13.62
shoulder = 13.1
shoulder_at = 26.11
neck = 11.43
case_length = 38.21
overall_length = 56.22
bullet = 10.92
sources = ["https://municion.org/producto/104-x-38-r-swiss-vetterli-cf-m-1869-81/"]

[introduced]
unknown = "the first year of the centrefire loading is not known; the rimfire original dates from 1867"

[primer]
# The original primers measure 6.47 mm (3 specimens), the .254 in. Berdan size. Today's cases, made
# from 8x50 R Lebel brass, take large rifle primers:
# https://www.ammunitionartifacts.com/metriccartridgecases/104x38r-swiss-vetterli-m6981-center-fire-6dtb4
size = "berdan-nitro"
sources = ["https://municion.org/producto/104-x-38-r-swiss-vetterli-cf-m-1869-81/"]

[shoulder_angle]
# AECC drawing 11-038-BBC-011 on municion.org: SØ 13.60, NØ 11.70, SL 27.00, NL 6.00, CL 38.10.
degrees = 10.6
sources = ["https://municion.org/producto/104-x-38-r-swiss-vetterli-cf-m-1869-81/"]

[case_head]
# AECC drawing 11-038-BBC-011: HL 1.90 from the base to the rim's front. The rim stands on a foot («Mauser
# base») that the drawing does not dimension: 6 of those 15 px, that share of rim_thickness.
rim_thickness = 1.9
foot = 0.8
sources = ["https://municion.org/producto/104-x-38-r-swiss-vetterli-cf-m-1869-81/"]

[bullet]
type = "paper"
sources = ["https://municion.org/ficha-11-038-bbc-011-0001/"]
