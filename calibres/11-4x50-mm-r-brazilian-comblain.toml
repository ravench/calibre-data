# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Like the Belgian Comblain round to look at, but the two do not interchange.
name = "11.4x50 mm R Brazilian Comblain"
# Firearms: book:cotw-18 p. 567.
categories = ["black-powder", "rifle"]
kind = "rimmed"
profile = "round"
aliases = ["11.4x50r comblain"]
display_aliases = ["11.4x50 mm R Comblain M74"]

origin = "BR"
origin_sources = []
obsolete = true
rare = true

[mm]
rim = 17.32
base = 14.94
shoulder = 13.46
shoulder_at = 44.28
neck = 12.55
case_length = 51.31
overall_length = 66.55
bullet = 11.48
# shoulder_at from the AECC drawing 12-050-BBC-060 (municion.org), carried from the mouth. The sources cross the
# names of the Comblain rounds, so the drawings are assigned by size. This one is titled «11 mm Chilean Comblain
# Rifle M 1874» (also 11,6 x 50 R) and is within 0.15 mm of the book's row for this round on every diameter of the
# case, and 1.1 mm on its length. Municion.org lists «11,4 x 50 R Brazilian Comblain M74» as another name of its
# 53 mm round (drawing 11-053-BBC-030, Model 1889), whose sizes are those of the book's 11x53 mm R Comblain.
sources = ["book:cotw-18 p. 574", "https://municion.org/producto/11-mm-chilean-comblain-rifle-m-1874/"]

[introduced]
# M74 is the model year; COTW gives no other.
year = 1874
sources = ["book:cotw-18 p. 567"]

[primer]
size = "large-rifle"
sources = []

[shoulder_angle]
# AECC drawing on municion.org: SØ 13.35, NØ 12.54, SL 43.20, NL 4.50, CL 50.23.
degrees = 9.1
sources = ["https://municion.org/producto/11-mm-chilean-comblain-rifle-m-1874/"]

[case_head]
# AECC drawing 12-050-BBC-060 (municion.org): RT 1.95; the book gives none.
rim_thickness = 1.95
sources = ["https://municion.org/producto/11-mm-chilean-comblain-rifle-m-1874/"]

[bullet]
# The military load: a lead bullet over blackpowder.
type = "lead"
sources = ["book:cotw-18 p. 567"]

[case]
material = "brass"
sources = []
