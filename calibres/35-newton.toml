categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["35 newton"]

origin = "US"
origin_sources = ["https://municion.org/producto/35-newton/"]
obsolete = true
rare = true

[mm]
rim = 13.33
base = 13.28
shoulder = 12.65
shoulder_at = 52.6
neck = 9.73
case_length = 64.01
overall_length = 85.09
