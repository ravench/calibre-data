# Firearms: book:cotw-18 p. 665.
categories = ["rimfire", "handgun"]
kind = "rimfire"
profile = "round"
aliases = ["44 short rf", "44 short rimfire"]

origin = "US"
obsolete = true
rare = true

[mm]
rim = 13.18
base = 11.3
neck = 11.3
case_length = 17.48
