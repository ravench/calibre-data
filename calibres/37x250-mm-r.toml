# The round of the German navy's 3.7 cm SK C/36 and Flak M42: the army's 37x249R (of the Pak 36) with a
# thicker rim. Rapid Fire's table calls it the 37x249R and gives its rim and base; its name gives the
# bore and case length (Autocannon), Autocannon p. 158 the length of the round. The specimen drawing
# on municion.org (37-250-BBC-040) is of the army's Pak 36 round: its rim (RØ 52.00, RT 2.50) is 0.6 mm
# wider than Rapid Fire's and 1.4 mm thinner than Autocannon's, so nothing is taken from it.
