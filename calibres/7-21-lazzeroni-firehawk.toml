# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Lazzeroni's .284 long magnum, on its .544 in. case. Chambered only on special order since 1999 (COTW 18 p. 387).
name = "7.21 Lazzeroni Firehawk"
guns = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["7.21 firehawk", "7.21mm firehawk", "lazzeroni firehawk"]

origin = "US"
origin_sources = ["https://municion.org/producto/721-mm-lazzeroni-firehawk/"]
rare = true

[mm]
rim = 13.82
base = 13.82
shoulder = 13.31
shoulder_at = 59.09
neck_at = 64.12
neck_base = 8.3
neck = 8.08
case_length = 71.12
overall_length = 90.17
bullet = 7.21
# shoulder_at from the AECC drawing 07-071-BGC-030 (municion.org): SL 59.00 on a case of CL 71.03, taken from the
# mouth (case_length - (CL - SL)).
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/721-mm-lazzeroni-firehawk/"]

[introduced]
year = 1996
sources = ["book:cotw-18 p. 387"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 452"]

[shoulder_angle]
# COTW 18 p. 387: a 30-degree shoulder.
degrees = 30
sources = ["book:cotw-18 p. 387"]

[case_head]
# .055 in. (COTW); groove from the AECC drawing 07-071-BGC-030 (municion.org): RT 1.50, HL 3.50, GØ 12.25, GW 1.14,
# HØ 13.82; ramp angle from HL = RT + GW + ((HØ - GØ)/2)/tan(angle).
rim_thickness = 1.4
ramp_top = 3.5
groove_diameter = 12.25
ramp_angle = 42.0
groove_width = 1.14
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/721-mm-lazzeroni-firehawk/"]

[bullet]
# Soft point: Lazzeroni loads premium hunting bullets from Nosler, Barnes or Swift (COTW 18 p. 387).
type = "softpoint"
sources = ["book:cotw-18 p. 387"]

[case]
# municion.org's photo shows a brass case.
material = "brass"
sources = ["https://municion.org/producto/721-mm-lazzeroni-firehawk/"]
