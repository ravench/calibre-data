# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Spencer's necked round for the small carbine and sporting rifle of 1866.
name = ".56-46 Spencer"
categories = ["rimfire"]
kind = "rimfire"
profile = "round"
aliases = ["56-46", "56-46 spencer", "46 spencer"]

origin = "US"
obsolete = true
rare = true

[mm]
rim = 16.28
base = 14.17
shoulder = 14.1
shoulder_at = 12.9
neck = 12.14
case_length = 26.29
overall_length = 40.51
bullet = 11.81
# No source yet for shoulder_at (estimated: a neck one calibre long and the shoulder at 32 degrees).
sources = ["book:cotw-18 p. 670"]

[introduced]
year = 1866
sources = ["book:cotw-18 p. 667"]

[bullet]
# COTW 18 p. 667 does not name the bullet's material; lead, as in the other rimfire rounds of its time.
type = "lead"
