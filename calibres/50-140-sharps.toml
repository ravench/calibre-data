# Guns: book:cotw-18 p. 244.
guns = ["rifle"]
black_powder = true
kind = "rimmed"
# Nose: flat, as the specimen drawing shows it (https://municion.org/producto/50-140-700-sharps-3-1-4/).
profile = "flat"
aliases = ["50-140 sharps", "50-140 winchester express", "50-3 1/4 sharps"]

origin = "US"
origin_sources = ["book:ammo-encyclopedia-2 p. 471"]
obsolete = true
rare = true

[mm]
