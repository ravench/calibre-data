# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Don Allen's 7 mm on the .404 Jeffery case, shortened and with a slightly larger, no longer rebated rim.
# Dakota Arms became Parkwest Arms in 2021 (COTW 18 p. 385).
name = "7 mm Dakota"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["7mm dakota", "7 dakota"]

origin = "US"
origin_sources = ["https://municion.org/producto/7-mm-dakota/"]
rare = true

[mm]
rim = 13.82
base = 13.82
shoulder = 13.49
shoulder_at = 50.24
neck = 7.98
case_length = 63.5
overall_length = 84.58
bullet = 7.21
sources = ["book:cotw-18 p. 451", "https://municion.org/producto/7-mm-dakota/"]

[introduced]
# Ballistic Studies: Don Allen brought out his Dakota rounds in 1992; COTW gives no year.
year = 1992
sources = ["https://www.ballisticstudies.com/Knowledgebase/Dakota+proprietary+cartridges.html"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 451"]

[shoulder_angle]
# AECC drawing on municion.org: SØ 13.43, NØ 8.00, SL 50.00, NL 7.80, CL 63.26.
degrees = 26.4
sources = ["https://municion.org/producto/7-mm-dakota/"]

[case_head]
# .042 in.
rim_thickness = 1.07
sources = ["book:cotw-18 p. 451"]

[bullet]
# Soft point inferred from its use as a hunting round; the page gives weights only.
type = "softpoint"
sources = []

[case]
material = "brass"
sources = []
