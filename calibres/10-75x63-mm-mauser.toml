# Measurements from Cartridges of the World, 18th ed. (inches converted to mm); the rim from two specimen drawings.
# The older and shorter case of the 10.75x68 mm.
name = "10.75x63 mm Mauser"
categories = ["rifle"]
kind = "rimless"
profile = "round"
aliases = ["10.75x63"]

origin = "DE"
origin_sources = ["book:ammo-encyclopedia-2 p. 447"]
obsolete = true
rare = true

[mm]
# rim: the book's table has a rebated rim of .467 in. (11.86 mm) in every edition, but its text gives the round the
# dimensions of the 10.75x68 mm but for the length (C.I.P. 10,75 x 68: rim and base 12.57), and two specimen
# drawings show a rimless case: AECC 11-063-BGC-010 on municion.org (rim 12.60 on a head of 12.54) and naboje.org
# (12.50 on 12.52). The rim is the AECC drawing's.
rim = 12.6
base = 12.52
shoulder = 12.17
shoulder_at = 52.26
neck = 11.35
case_length = 62.74
overall_length = 81.79
bullet = 10.77
sources = [
  "book:cotw-18 p. 652",
  "https://municion.org/producto/1075-x-63-g-mauser/",
  "https://naboje.org/node/11259",
]

[introduced]
# COTW: about 1910.
year = 1910
sources = ["book:cotw-18 p. 647"]

[primer]
size = "large-rifle"
sources = []

[shoulder_angle]
# AECC drawing on municion.org: SØ 12.10, NØ 11.38, SL 52.50, NL 8.50, CL 62.98.
degrees = 10.3
sources = ["https://municion.org/producto/1075-x-63-g-mauser/"]

[case_head]
# AECC drawing: RT 1.15, HL 3.70, GØ 11.00, GW 1.20, HØ 12.54; ramp angle from
# HL = RT + GW + ((HØ - GØ)/2)/tan(angle). naboje.org's drawing: rim thickness 1.09, groove 11.10. The book gives no
# rim thickness.
rim_thickness = 1.15
ramp_top = 3.7
groove_diameter = 11.0
ramp_angle = 30.0
sources = ["https://municion.org/producto/1075-x-63-g-mauser/"]

[bullet]
# COTW gives only its weight.
type = "softpoint"
sources = []

[case]
material = "brass"
sources = []
