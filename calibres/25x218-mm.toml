# The rimless version of the 25x218 mm SR that replaced it in Soviet naval guns after the war: the 110-PM
# of 1950 and the faster M-110, in the 2M-3 and 2M-3M twin mountings. Its name gives the bore and case
# length, Jane's table the rim, base and neck, Autocannon p. 133 the length of the round, the specimen
# drawing 25-219-BGC-020 on municion.org the shoulder and the head. municion.org has drawings of two cases,
# with a 34 and a 29 mm neck (-010 and -020), whose necks start 1.10 and 0.95 mm wider than Jane's (NØ 27.18
# and 27.03 against 26.08). At the mouth, where the file measures the neck, the 29 mm neck is 0.12 mm wider
# than Jane's (MØ 26.20) and the 34 mm neck 0.77 mm (MØ 26.85), so the file takes the 29 mm neck's case.
# The choice rests on that one specimen's mouth: naboje.org's drawing of the same case (node 8411) has its
# mouth at 27.02, 0.94 mm wider than Jane's, and starts the shoulder 1.0 mm further up (P2 31.11 at L1
# 185.90 of a 218.70 mm case, H1 26.97 at L2 189.90); the 34 mm neck's case starts it 2.8 mm further down.
name = "25x218 mm"
guns = ["cannon"]
kind = "rimless"
profile = "spitzer"
aliases = ["25 mm 2m-3", "2m-3", "110-pm"]
origin = "SU"
origin_sources = ["book:rapid-fire p. 228"]

[mm]
rim = 34.9
base = 34.8
shoulder = 31.15
shoulder_at = 184.1
neck_at = 188.7
neck_base = 27.03
# Drawing 25-219-BGC-020: SØ 31.15, NØ 27.03, SL 184.90, NL 29.30, CL 218.80, TL 291.73.
# The neck narrows from where it starts (NØ) to within 0.12 mm of Jane's at the mouth (MØ 26.20).
shoulder_angle = 24.1
