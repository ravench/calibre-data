# Rifle batch 5 (2026-11): first added from the page named in INTRODUCED, now SAAMI's (see [mm]); the Nosler line shares the .28 Nosler case outside.
name = ".300 Ruger Compact Magnum"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["300rcm"]

origin = "US"
origin_sources = [
  "https://en.wikipedia.org/wiki/.300_Ruger_Compact_Magnum",
  "book:ammo-encyclopedia-2 p. 316",
]
# Still made, but hardly ever found:
