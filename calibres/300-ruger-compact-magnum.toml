[mm]
# SAAMI 300 Ruger Compact Magnum, maximum cartridge.
# Shoulder and shoulder_at: SAAMI's, where the body and shoulder lines meet.
rim = 13.51
base = 13.51
shoulder = 13.08
shoulder_at = 41.47
neck = 8.64
case_length = 53.34
overall_length = 72.14
bullet = 7.85
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=122", "https://en.wikipedia.org/wiki/.300_Ruger_Compact_Magnum", "https://municion.org/producto/300-ruger-compact-magnum/"]

[introduced]
year = 2007
sources = ["https://en.wikipedia.org/wiki/.300_Ruger_Compact_Magnum"]

[primer]
size = "large-rifle"
sources = ["https://en.wikipedia.org/wiki/.300_Ruger_Compact_Magnum"]

[shoulder_angle]
# SAAMI: 30 deg (the AECC drawing 08-053-BGC-110 on municion.org gives 38).
degrees = 30
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=122"]

[case_head]
# shortened .375 Ruger case; C.I.P. 375 Ruger
