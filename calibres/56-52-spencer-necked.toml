# Measurements converted from inches.
# The .56-52 with Spencer's slight neck; it fires in the same arms as the straight one.
name = ".56-52 Spencer Necked"
# Guns: book:cotw-18 p. 668.
guns = ["rifle"]
kind = "rimfire"
profile = "round"
aliases = ["56-52 spencer necked"]

origin = "US"
origin_sources = ["https://municion.org/producto/56-52-spencer-rf-necked-shortest-case/"]
obsolete = true
rare = true

[mm]
rim = 16.31
base = 14.22
shoulder = 14.17
shoulder_at = 12.4
neck = 13.89
case_length = 25.91
overall_length = 42.16
bullet = 13.33
# shoulder_at estimated: a neck one calibre long and the shoulder at 32 degrees.
# No drawing is taken for it. municion.org has two necked .56-52 drawings near the book's case of 25.91 mm, and they
# do not agree on the neck. The longest case (13-026-BBR-010: CL 26.75, SL 16.00, NL 7.00, SØ 14.20, NØ 13.60) is
# within the size limits, but its page is the one this catalogue uses for the straight .56-52, it says that the
# longest cases come necked or tapered and are hard to tell apart, and the drawing fits the straight round's row as
# well. The shortest case (13-024-BBR-010: CL 24.30, SL 13.30, NL 5.00, SØ 13.90, NØ 13.68) is the page titled
# «necked» and is 1.61 mm shorter than the book's, just outside the limit. From the mouth the two start the shoulder
# 0.25 mm apart (it would be at 15.16 or 14.91 mm here), but their necks are 7.0 and 5.0 mm long. A French case is
# shorter still (13-023-BBR-010: CL 22.04).
unsourced = ["shoulder_at"]
sources = ["book:cotw-18 p. 670"]

[introduced]
year = 1866
sources = ["book:cotw-18 p. 668"]

[case_head]
# .065 in.
rim_thickness = 1.65
sources = ["book:cotw-18 p. 670"]

[bullet]
# COTW 18 p. 668 does not name the bullet's material; municion.org's sheet shows a lead one.
type = "lead"
sources = ["https://municion.org/ficha-13-024-bbr-010-0001/"]

[case]
# municion.org says the case is copper, and its photos of Leet's and Ethan Allen's rounds show it.
material = "copper"
sources = ["https://municion.org/producto/56-52-spencer-rf-necked-shortest-case/"]
