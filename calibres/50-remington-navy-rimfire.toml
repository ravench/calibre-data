# Measurements converted from inches.
# For the 1865 Remington Navy rolling-block pistol; an inside-primed centrefire round followed
# within a year.
name = ".50 Remington Navy Rimfire"
# Guns: book:cotw-18 p. 667.
guns = ["handgun"]
kind = "rimfire"
profile = "round"
aliases = ["50 remington navy rf", "50 remington navy rimfire"]

origin = "US"
origin_sources = ["https://municion.org/producto/50-remington-navy-m-1865-rf/"]
obsolete = true
rare = true

[mm]
rim = 16.31
