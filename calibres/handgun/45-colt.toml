# Round nose with a small flat, as factory lead loads come (Winchester X45CP2 "255 gr Lead Round
# Nose", Raven's W-W round photographed 2026-11-08), not the wide flat point; the 1873 original
# was an "ogival & flat nosed" 255 gr bullet (Wikipedia).
name = ".45 Colt"
kind = "rimmed"
profile = "round"
aliases = ["45colt", "45lc", "45longcolt"]
display_aliases = [".45 Long Colt"]

origin = "US"

[mm]
rim = 12.9
base = 12.2
neck = 12.2
case_length = 32.6
overall_length = 40.6
bullet = 11.5
# No source yet for rim.
sources = [
  "book:donnelly p. 591",
  "book:cotw-18 p. 529",
]

[introduced]
# designed 1872, produced from 1873
year = 1873
sources = ["https://en.wikipedia.org/wiki/.45_Colt"]

[primer]
size = "large-pistol"
sources = ["https://en.wikipedia.org/wiki/.45_Colt"]

[case_head]
# .055 in.
rim_thickness = 1.4
sources = ["book:cotw-18 p. 529"]

[bullet]
type = "lead"
sources = ["https://en.wikipedia.org/wiki/.45_Colt"]

[case]
# Frankford Arsenal's first army rounds (1873/74) and its 1875 Schofield round had copper cases; the photo
# shows both next to a brass one of today.
material = "copper"
sources = ["https://commons.wikimedia.org/wiki/File:Colt_.45_LC_Cartridges.JPG"]

[current_cases]
# Brass (the round of today in the photo); CCI Blazer's aluminium cases.
materials = ["brass", "aluminium"]
sources = ["https://commons.wikimedia.org/wiki/File:Colt_.45_LC_Cartridges.JPG",
           "https://www.cci-ammunition.com/handgun/blazer/blazer-aluminum"]
