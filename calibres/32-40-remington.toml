# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# For the Remington No. 1 rolling block sporting rifle; a long, tapered shoulder.
name = ".32-40 Remington"
# Guns: book:cotw-18 p. 199.
guns = ["rifle"]
black_powder = true
kind = "rimmed"
# Nose: flat, as the AECC specimen drawing shows it (https://municion.org/producto/32-40-150-remington-hepburn/).
profile = "flat"
aliases = ["32-40 remington", "32-40-150 remington"]

origin = "US"
origin_sources = ["book:ammo-encyclopedia-2 p. 413"]
obsolete = true
rare = true

[mm]
rim = 13.59
base = 11.51
shoulder = 9.09
shoulder_at = 45.7
neck = 8.38
case_length = 54.1
overall_length = 82.55
bullet = 7.85
# shoulder_at estimated: a neck one calibre long and the shoulder at 32 degrees.
unsourced = ["shoulder_at"]
sources = ["book:cotw-18 p. 250"]

[introduced]
# COTW: introduced about 1871 to 1872, shortly after the rifle of 1870.
year = 1871
sources = ["book:cotw-18 p. 199"]

[primer]
size = "small-rifle"
sources = ["book:cotw-18 p. 250"]

[case_head]
# AECC drawing 08-054-TBC-020 (municion.org): RT 1.60. Its shoulder is not taken: the drawing's (SØ 9.70) is 0.6 mm
# wider than the book's.
rim_thickness = 1.6
sources = ["https://municion.org/producto/32-40-150-remington-hepburn/"]

[bullet]
type = "lead"
sources = ["book:cotw-18 p. 199"]

[case]
# municion.org's photos show brass cases (UMC's).
material = "brass"
sources = ["https://municion.org/producto/32-40-150-remington-hepburn/"]
