[case_head]
# AECC drawing 11-083-BBC-030 (municion.org): RT 1.04. municion.org lists this 3¼ in. case for the blackpowder, the
# nitro-for-black and the Nitro Express loads. Its shoulder is not taken: the specimen's (SØ 13.19) is 0.49 mm wider
# than the book's, and its cone, drawn between the book's diameters, would leave a neck 2.6 mm longer than the
# specimen's (NL 15.40), over the 1.5 mm the rule allows.
rim_thickness = 1.04
