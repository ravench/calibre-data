# Measurements converted from inches.
# The cordite version of the .500/450 Magnum Express, probably by Holland & Holland.
name = ".500/450 Nitro Express"
guns = ["rifle"]
kind = "rimmed"
profile = "round"
aliases = ["500/450 ne", "500/450 3 1/4"]
display_aliases = [".500/450 Nitro Express 3¼ inch"]

origin = "GB"
origin_sources = ["book:ammo-encyclopedia-2 p. 465"]
obsolete = true
rare = true

[mm]
rim = 16.36
base = 14.48
shoulder = 12.7
shoulder_at = 61.08
neck_at = 67.15
neck_base = 12.25
# The book's shoulder and neck diameters over the shoulder length of the drawing (CL 82.47 - NL 15.40 -
# SL 61.00 = 6.07 mm). The specimen's own cone (4.4 degrees) between the book's diameters would leave a neck
# 2.6 mm longer than the specimen's (NL 15.40), over the 1.5 mm the rule allows.
shoulder_angle = 2.5
cite.shoulder_angle = ["https://municion.org/producto/500-450-express-3-1-4-bp-nbp-ne/"]
neck = 12.17
case_length = 82.55
overall_length = 99.31
bullet = 11.63
# shoulder_at from the drawing 11-083-BBC-030: SL 61.00 on a case of CL 82.47, taken from the mouth
# (case_length - (CL - SL)). The drawing's shoulder (SØ 13.19) is 0.49 mm wider than the book's, its neck (NØ 12.25)
# 0.08 mm. Donnelly starts the shoulder 1.4 mm earlier (J 2.35 in.) and the neck 0.3 mm later.
sources = ["book:cotw-18 p. 608", "https://municion.org/producto/500-450-express-3-1-4-bp-nbp-ne/"]

[introduced]
# COTW: around the end of the nineteenth century; 1900 is kept.
year = 1900
sources = ["book:cotw-18 p. 599"]

[primer]
# The table gives a .254 in. Berdan primer.
size = "berdan-nitro"
sources = ["book:cotw-18 p. 608"]

[case_head]
# Drawing 11-083-BBC-030: RT 1.04. municion.org lists this 3¼ in. case for the blackpowder, the
# nitro-for-black and the Nitro Express loads.
rim_thickness = 1.04
sources = ["https://municion.org/producto/500-450-express-3-1-4-bp-nbp-ne/"]

[bullet]
type = "softpoint"
sources = ["book:cotw-18 p. 599"]

[case]
# The photo shows a brass case.
material = "brass"
sources = ["https://municion.org/producto/500-450-express-3-1-4-bp-nbp-ne/"]
