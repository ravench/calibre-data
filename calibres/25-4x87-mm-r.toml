# The round of the Vickers 1-inch aircraft cannon, made only by Vickers-Terni in Italy: it saw some
# service in Italian bombers in the First World War, and the Swedish navy bought it in 1922 for its
# submarines (Akan m/22). Its name gives the bore and case length, Rapid Fire's table the rim and base,
# Autocannon p. 133 the length of the round.
name = "25.4x87 mm R"
guns = ["cannon"]
kind = "rimmed"
profile = "spitzer"
aliases = ["25x87r", "25.4x87r", "1-inch vickers", "vickers-terni"]
# Vickers designed it in Britain; Vickers-Terni made it in Italy, which used it, as did Sweden
# (Autocannon p. 133): GB
origin = "IT"
origin_sources = ["book:rapid-fire p. 227"]

[mm]
rim = 31.5
base = 28.1
case_length = 87.0
overall_length = 162.0
bullet = 25.4
sources = ["book:rapid-fire p. 227", "book:autocannon p. 133"]

[introduced]
# Autocannon: designed by Vickers in 1914.
year = 1914
sources = ["book:autocannon p. 133"]

[case]
material = "brass"
sources = ["book:autocannon p. 133"]
