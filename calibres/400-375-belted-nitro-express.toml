# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Holland & Holland's first belted case, the world's first.
name = ".400/375 Belted Nitro Express"
guns = ["rifle"]
kind = "belted"
profile = "round"
aliases = ["400/375", "400/375 h&h"]
display_aliases = [".400/375 H&H"]

origin = "GB"
origin_sources = [
  "https://municion.org/producto/400-375-belted-nitro-express-holland-holland/",
]
obsolete = true
rare = true

[mm]
rim = 11.84
belt = 12.06
base = 11.38
shoulder = 11.05
shoulder_at = 43.82
neck_at = 45
neck_base = 10.12
neck = 10.08
case_length = 63.5
overall_length = 76.2
bullet = 9.52
# The table's base is the belt; the body in front of it is Donnelly's.
# belt and shoulder_at from the AECC drawing 09-063-BFC-020 (municion.org): LØ 12.06 over a rim of RØ 11.78, and
# SL 43.70 on a case of CL 63.38, taken from the mouth (case_length - (CL - SL)). Donnelly's shoulder starts at 42.42.
sources = [
  "book:cotw-18 p. 608",
  "book:donnelly p. 515",
  "https://municion.org/producto/400-375-belted-nitro-express-holland-holland/",
]

[introduced]
year = 1905
sources = ["book:cotw-18 p. 590"]

[primer]
# The table gives a .217 in. Berdan primer, within 0.2 mm of the large Boxer size.
size = "large-rifle"
diameter = 5.51
sources = ["book:cotw-18 p. 608"]

[shoulder_angle]
# AECC drawing on municion.org: SØ 11.00, NØ 10.12, SL 43.70, NL 18.50, CL 63.38.
degrees = 20.4
sources = ["https://municion.org/producto/400-375-belted-nitro-express-holland-holland/"]

[case_head]
# AECC drawing 09-063-BFC-020 (municion.org): RT 1.00, GØ 10.30, GW 0.90, the ramp up to the belt (LØ 12.06) ends at
# HL 3.00 and the belt (LW 2.42) at 5.42; ramp angle from HL = RT + GW + ((LØ - GØ)/2)/tan(angle). Donnelly gives the
# rim .062 in. (1.57): more than 0.3 mm over the drawing's, so the whole head is the drawing's.
rim_thickness = 1.0
ramp_top = 5.42
groove_diameter = 10.3
ramp_angle = 39.0
groove_width = 0.9
sources = ["https://municion.org/producto/400-375-belted-nitro-express-holland-holland/"]

[bullet]
type = "softpoint"
sources = ["book:cotw-18 p. 590"]
