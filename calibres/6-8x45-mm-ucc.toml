# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Kramer Defense's 5.56x45 mm case necked up to .277 in. for AR-15 rifles.
name = "6.8x45 mm UCC"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["6.8x45", "6.8x45 ucc", "6.8x45 kramer"]

origin = "US"
origin_sources = []
obsolete = true
rare = true

[mm]
rim = 9.52
base = 9.47
shoulder = 8.86
shoulder_at = 36.1
neck = 7.77
case_length = 44.7
overall_length = 53.34
bullet = 7.04
# The table prints the rim as 375; .375 in. is meant.
# shoulder_at: case_length less the 8.59 mm (.3382 in.) from the shoulder start to the end of the neck on
# Pacific Tool's chamber reamer drawing (print 42050, 2015); the chamber's shoulder .3553 and neck .307 in.
# sit a few thou over ours. The chamber's neck end is taken as the case mouth; a chamber neck usually
# runs .010-.015 in. past it, which would put the shoulder 0.3 mm higher.
sources = [
  "book:cotw-18 p. 249",
  "https://www.pacifictoolandgauge.com/68--223-68x45-UCC-Finish-Chamber-Reamer_p_117954.html",
]

[introduced]
# COTW: shown as the 6.8x45 Kramer in June 2008; sold as the UCC from 2015.
year = 2008
sources = ["book:cotw-18 p. 193"]

[primer]
size = "small-rifle"
sources = ["book:cotw-18 p. 249"]

[shoulder_angle]
# Pacific Tool's finish chamber reamer drawing (print 42050): 45 deg; the chamber's cone is the case's.
# Pacific Tool marks the angle from the axis, one side: its .32 Rem. C.I.P. print shows 23 deg, the
# C.I.P. sheet's half angle.
degrees = 45
sources = ["https://www.pacifictoolandgauge.com/68--223-68x45-UCC-Finish-Chamber-Reamer_p_117954.html"]

[case_head]
# from the 5.56x45 mm case; C.I.P. 300 AAC Blackout, also made from that case
rim_thickness = 1.14
ramp_top = 3.15
groove_diameter = 8.43
ramp_angle = 25.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/300-aac-blackout-180801-en.pdf"]

[bullet]
# Open-tip match factory loads, which count as jacketed.
type = "jacketed"
sources = ["book:cotw-18 p. 193"]

[case]
material = "brass"
sources = []
