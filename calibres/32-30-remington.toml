# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# For the Remington-Hepburn No. 3 rifle; like the .32-20 WCF.
name = ".32-30 Remington"
# Firearms: book:cotw-18 p. 201.
categories = ["black-powder", "rifle"]
kind = "rimmed"
profile = "round"
aliases = ["32-30 remington", "32-30"]

origin = "US"
origin_sources = ["book:ammo-encyclopedia-2 p. 412"]
obsolete = true
rare = true

[mm]
rim = 11.1
base = 9.6
shoulder = 9.07
shoulder_at = 31.18
neck = 8.43
case_length = 41.66
overall_length = 51.05
bullet = 7.92
# shoulder_at from the AECC drawing 08-041-BBC-050 (municion.org): SL 31.00 on a case of CL 41.48, taken from the mouth
# (case_length - (CL - SL)). The drawing's shoulder and neck (SØ 8.94, NØ 8.49) are the book's within 0.13 mm.
# Donnelly starts the shoulder 1.2 mm later (J 1.275 in.).
sources = ["book:cotw-18 p. 250", "https://municion.org/producto/32-30-125-remington-hepburn/"]

[introduced]
# COTW: first made in November 1884.
year = 1884
sources = ["book:cotw-18 p. 201"]

[primer]
size = "small-rifle"
sources = ["book:cotw-18 p. 250"]

[shoulder_angle]
# The book's shoulder and neck diameters over the shoulder length of the AECC drawing (CL 41.48 - NL 7.30 -
# SL 31.00 = 3.18 mm). The specimen's own cone (4.0 degrees) between the book's diameters would start the neck
# 1.6 mm after the specimen's.
degrees = 5.7
sources = ["https://municion.org/producto/32-30-125-remington-hepburn/"]

[case_head]
# AECC drawing 08-041-BBC-050 (municion.org): RT 1.39.
rim_thickness = 1.39
sources = ["https://municion.org/producto/32-30-125-remington-hepburn/"]

[bullet]
type = "lead"
sources = ["book:cotw-18 p. 201"]

[case]
# municion.org's photos show brass cases (UMC's and an unmarked one).
material = "brass"
sources = ["https://municion.org/producto/32-30-125-remington-hepburn/"]
