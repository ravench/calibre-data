# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Lazzeroni's .338 long magnum, on its .577 in. case.
name = "8.59 Lazzeroni Titan"
guns = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["8.59 titan", "8.59mm titan", "lazzeroni titan"]

origin = "US"
origin_sources = ["https://municion.org/producto/859-mm-lazzeroni-titan/"]
rare = true

[mm]
rim = 14.66
base = 14.66
shoulder = 14.15
shoulder_at = 59.04
neck_at = 63.12
neck_base = 9.49
# COTW 18 p. 404: a 30-degree shoulder.
shoulder_angle = 30
cite.shoulder_angle = ["book:cotw-18 p. 404"]
neck = 9.37
case_length = 71.12
overall_length = 91.44
bullet = 8.59
# shoulder_at from the AECC drawing 09-071-BGC-005 (municion.org): SL 59.00 on a case of CL 71.08, taken from the
# mouth (case_length - (CL - SL)).
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/859-mm-lazzeroni-titan/"]

[introduced]
# COTW: designed in 1994 from a design of 1992.
year = 1994
sources = ["book:cotw-18 p. 404"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 452"]

[case_head]
# .060 in. (COTW); groove from the AECC drawing 09-071-BGC-005 (municion.org): RT 1.40, HL 3.50, GØ 13.00, GW 1.20,
# HØ 14.65; ramp angle from HL = RT + GW + ((HØ - GØ)/2)/tan(angle).
rim_thickness = 1.52
ramp_top = 3.5
groove_diameter = 13.0
ramp_angle = 43.0
groove_width = 1.2
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/859-mm-lazzeroni-titan/"]

[bullet]
# Soft point: Lazzeroni loads premium hunting bullets from Nosler, Barnes or Swift (COTW 18 p. 404).
type = "softpoint"
sources = ["book:cotw-18 p. 404"]

[case]
# municion.org's photo shows a brass case.
material = "brass"
sources = ["https://municion.org/producto/859-mm-lazzeroni-titan/"]
