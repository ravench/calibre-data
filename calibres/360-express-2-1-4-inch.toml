# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# A blackpowder express round; later also loaded with nitro powder.
name = ".360 Express 2¼ inch"
# Guns: book:cotw-18 p. 588.
guns = ["rifle"]
black_powder = true
kind = "rimmed"
# Nose: flat, as the AECC specimen drawing shows it (https://municion.org/producto/360-express-2-1-4-bp-nbp-ne/).
profile = "flat"
aliases = ["360 express", "360 2 1/4"]

origin = "GB"
origin_sources = []
obsolete = true
rare = true

[mm]
rim = 12.19
base = 10.92
neck = 9.75
case_length = 57.15
overall_length = 76.2
bullet = 9.27
# flat: the AECC drawing (municion.org) gives the flat tip as Ø 3,00 (whole millimetres).
flat = 3.0
cite.flat = ["https://municion.org/producto/360-express-2-1-4-bp-nbp-ne/"]
sources = ["book:cotw-18 p. 608"]

[introduced]
unknown = "From before 1873; COTW 18 p. 588 gives no year."
sources = ["book:cotw-18 p. 588"]

[primer]
# The table gives a .241 in. Berdan primer, between the large Boxer and the .254 in. nitro sizes; large
# rifle, as municion.org measures on the .400/350, for which the table also gives .241 in.
size = "large-rifle"
sources = []

[case_head]
# .040 in.
rim_thickness = 1.02
sources = ["book:cotw-18 p. 608"]

[bullet]
# COTW: the blackpowder loads had bare or paper-patched lead bullets.
type = "lead"
sources = ["book:cotw-18 p. 588"]
