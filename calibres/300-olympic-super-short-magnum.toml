# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Olympic Arms' shortened WSSM case for its AR-15 rifles.
name = ".300 Olympic Super Short Magnum"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["300 ossm", "300 olympic super short magnum", "300 olympic"]

origin = "US"
origin_sources = []
# Olympic Arms, its only maker, closed in 2017 (https://en.wikipedia.org/wiki/Olympic_Arms).
obsolete = true
rare = true

[mm]
rim = 13.59
base = 14.1
shoulder = 13.82
shoulder_at = 29.4
neck = 8.43
case_length = 42.42
overall_length = 57.15
bullet = 7.82
# shoulder_at: the .25 WSSM's (C.I.P. L1), assumed, not measured: COTW 18 p. 394 calls the round the .25 WSSM
# necked up to .308 (and, in its history, a "shortened" WSSM case, though the case length is the same); the
# body and shoulder Ø match it.
sources = ["book:cotw-18 p. 452", "https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page91.pdf"]

[introduced]
year = 2010
sources = ["book:cotw-18 p. 394"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 452"]

[shoulder_angle]
# The .25 WSSM's (C.I.P. 25 Win. SSM), assumed: COTW 18 p. 394 calls the round that case necked up to
# .308, and the WSSM rounds keep one shoulder (28-30 deg).
degrees = 30
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page91.pdf"]

[case_head]
# from the WSSM case (the same head on every WSSM sheet); C.I.P. 223 Win. Super Short Mag.
rim_thickness = 1.37
ramp_top = 3.35
groove_diameter = 12.19
ramp_angle = 45.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page87.pdf"]

[bullet]
# Olympic Arms' factory load: a soft-point boat-tail.
type = "softpoint"
sources = ["book:cotw-18 p. 394"]

[case]
material = "brass"
sources = []
