# Measurements from Cartridges of the World, 18th ed. (inches converted to mm), except base, shoulder
# and neck (municion.org's drawing, as the [mm] note says).
# A-Square's Dual Purpose Magnum: the full-length .375 H&H Magnum case blown out to .41.
name = ".400 A-Square DPM"
categories = ["rifle"]
kind = "belted"
profile = "round"
aliases = ["400 a-square dpm", "400 a-square dual purpose magnum", "400 asdpm"]

origin = "US"
origin_sources = ["https://municion.org/producto/400-a-square-dpm-belted/"]
rare = true

[mm]
rim = 13.46
base = 12.95
shoulder = 12.48
shoulder_at = 59.1
neck = 11.06
case_length = 72.39
overall_length = 91.44
bullet = 10.41
# base, shoulder, neck and shoulder_at: municion.org's profile drawing (base 12.95 at 5.6 mm, shoulder
# 12.48 at 57.7, neck 11.06 from 59.1 mm to the mouth at 71.0; shoulder_at = case_length less 71.0 - 57.7). COTW gives .520 and .450 in.
# (13.21, 11.43 mm) and a .521 in. base, but the same site's side photo gives shoulder/rim and neck/rim
# 0.93 and 0.81 (drawing 0.93, 0.82; COTW 0.98, 0.85), and the drawing's base and shoulder are those of
# its blown-out .375 H&H siblings (.416 Hoffman 13.03/12.47, .416 Remington 13.0/12.4). The case length stays COTW's 72.39 (the specimen: 71.0).
sources = ["book:cotw-18 p. 453", "https://municion.org/producto/400-a-square-dpm-belted/"]

[introduced]
# COTW: introduced in 2006, like the 400 Pondoro of 1992 on a .416 Rigby case.
year = 2006
sources = ["book:cotw-18 p. 418"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 453"]

[shoulder_angle]
# municion.org's profile drawing: shoulder 12.48 to neck 11.06 over 1.4 mm (57.7 to 59.1 mm on its 71.0 case).
# The side photo on the same page gives about 20 deg on both edges: the cone is only about 16 px there and
# its rounded corners spread it out, so the photo reads low.
degrees = 26.9
sources = ["https://municion.org/producto/400-a-square-dpm-belted/"]

[case_head]
# from the .375 H&H Magnum case; C.I.P. 375 H&H Mag.
rim_thickness = 1.27
ramp_top = 5.59
groove_diameter = 12.07
ramp_angle = 35.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-iii/tabiiical-en-page27.pdf"]

[bullet]
# Inferred: A-Square made its own big-game bullets for it; the page names no type (p. 419).
type = "softpoint"
sources = []

[case]
material = "brass"
sources = []
