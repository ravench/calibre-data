# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The .577 case necked to .50; blackpowder first, later a full Nitro Express.
name = ".577/500 Nitro Express"
categories = ["rifle"]
kind = "rimmed"
profile = "round"
aliases = ["577/500", "577/500 3 1/8"]
display_aliases = [".577/500 Nitro Express 3⅛ inch"]

origin = "GB"
origin_sources = []
obsolete = true
rare = true

[mm]
rim = 18.21
base = 16.38
shoulder = 14.86
shoulder_at = 59.96
neck = 13.36
case_length = 79.5
overall_length = 95.0
bullet = 12.9
# shoulder_at: the shoulder start of naboje.org's drawing (.577/.500 Express 3 1/8 in.: case 79.39, shoulder at 59.85),
# carried from the mouth. Its rim, base, shoulder, neck and case length are within 0.25 mm of the book's.
sources = ["book:cotw-18 p. 609", "https://naboje.org/node/1356"]

[introduced]
unknown = "Blackpowder first; COTW 18 p. 603 gives no year."
sources = ["book:cotw-18 p. 603"]

[primer]
# The table gives a .251 in. Berdan primer.
size = "berdan-nitro"
diameter = 6.38
sources = ["book:cotw-18 p. 609"]

[shoulder_angle]
# Drawing on naboje.org: SØ 14.83, NØ 13.56, SL 59.85, CL 79.39 and NL 15.50, the neck start read off the drawing's
# scale: the picture shows the case, the shoulder start, the rim and the overall length as labelled, within 0.05 mm.
degrees = 8.9
sources = ["https://naboje.org/node/1356"]

[case_head]
# .055 in. (the naboje.org drawing: 1.45 mm).
rim_thickness = 1.4
sources = ["book:cotw-18 p. 609"]

[bullet]
# Lead: the Nitro-for-Black factory load; the full Nitro load that followed was a 570-grain FMJ
# (COTW 18 p. 603).
type = "lead"
sources = ["book:cotw-18 p. 603"]

[case]
material = "brass"
sources = []
