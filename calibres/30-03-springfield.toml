# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The US service round of 1903 with a 220-grain round-nosed bullet, replaced by the .30-06 in 1906.
name = ".30-03 Springfield"
categories = ["rifle"]
kind = "rimless"
profile = "round"
aliases = ["30-03", "30-03 government", "30-03 gov't"]

origin = "US"
obsolete = true
rare = true

[mm]
rim = 12.01
base = 11.94
shoulder = 11.2
shoulder_at = 49.49
neck = 8.64
case_length = 64.52
overall_length = 84.84
bullet = 7.82
# shoulder_at is L1 on the .30-06's C.I.P. sheet: the .30-06 is this case with a shorter neck (COTW 18 p. 197).
sources = ["book:cotw-18 p. 250", "https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page111.pdf"]

[introduced]
year = 1903
sources = ["book:cotw-18 p. 197"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 250"]

[shoulder_angle]
# Half the cone angle alpha on the .30-06's C.I.P. sheet.
degrees = 17.5
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page111.pdf"]

[case_head]
# the .30-06 kept this case's head; C.I.P. 30-06 Spring.
rim_thickness = 1.24
ramp_top = 3.16
groove_diameter = 10.39
ramp_angle = 36.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page111.pdf"]

[bullet]
type = "jacketed"
sources = []

[case]
material = "brass"
sources = []
