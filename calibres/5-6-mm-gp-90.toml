# Official name «5,6 mm Gewehrpatrone 90», short «5,6 mm GP 90» (Stgw 90, from 1990).
# Army regulation 53.096 d (Stgw 90, p. 18): steel-jacketed lead-core bullet and brass case; it
# gives weights but no case measurements.
name = "5.6 mm GP 90"
guns = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["gp90", "gp 90", "5.6", "5.6mm", "5.6gp90", "stgw90", "gewehrpatrone 90", "gwpat90", "cart 5.6 mm 90 f", "fass 90"]

origin = "CH"
origin_sources = ["https://en.wikipedia.org/wiki/SIG_SG_550"]

[mm]
# A 5.56x45 mm round (SIG SG 550 page); values from the C.I.P. 223 Rem. sheet, maximum cartridge,
# as for the .223 Remington and 5.56x45 mm NATO.
rim = 9.6
base = 9.58
shoulder = 9.0
shoulder_at = 36.52
neck_at = 39.55
neck_base = 6.43
# same case as .223 Rem
shoulder_angle = 23
cite.shoulder_angle = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/223-rem-170406-en.pdf", "https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=84"]
neck = 6.43
case_length = 44.7
overall_length = 57.4
bullet = 5.70
# nose: read to scale off the AECC drawing 06-045-BGC-050 (municion.org, the 5.56x45 mm M193 ball, same case and length):
# the curve starts 10.6 mm behind the tip, of the 12.59 mm out of its case (TL 57.15, CL 44.56).
nose = 10.6
cite.nose = ["https://municion.org/producto/556-x-45-otan/"]
sources = [
  "https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=84",
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-i/223-rem-170406-en.pdf",
  "https://en.wikipedia.org/wiki/.223_Remington",
  "https://en.wikipedia.org/wiki/SIG_SG_550",
]

[introduced]
# adopted with the Stgw 90
year = 1990
sources = ["https://en.wikipedia.org/wiki/SIG_SG_550", "https://www.vtg.admin.ch/dam/de/sd-web/iZ8NXEwaRRyw/53_096_d.pdf"]

[primer]
size = "small-rifle"
sources = []

[case_head]
# C.I.P. 223 Rem. (E 3.13); SAAMI gives the same rim, groove and ramp angle.
rim_thickness = 1.14
ramp_top = 3.13
groove_diameter = 8.43
ramp_angle = 25.0
groove_width = 0.76
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/223-rem-170406-en.pdf", "https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=84"]

[bullet]
type = "jacketed"
sources = ["https://www.vtg.admin.ch/dam/de/sd-web/iZ8NXEwaRRyw/53_096_d.pdf"]

[case]
material = "brass"
sources = ["https://www.vtg.admin.ch/dam/de/sd-web/iZ8NXEwaRRyw/53_096_d.pdf"]

[fired_by]
firearms = ["SIG Stgw 90"]
sources = ["https://www.vtg.admin.ch/dam/de/sd-web/iZ8NXEwaRRyw/53_096_d.pdf", "https://en.wikipedia.org/wiki/SIG_SG_550"]
