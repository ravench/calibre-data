# Measurements from the C.I.P. sheet (maximum cartridge).
# The second round for the Winchester Model 1905 self-loading rifle; semi-rimmed like the .35 WSL.
name = ".32 Winchester Self-Loading"
guns = ["rifle"]
kind = "semi-rimmed"
profile = "round"
aliases = ["32wsl", "32 wsl", "32 win. sl"]

origin = "US"
origin_sources = [
  "book:ammo-encyclopedia-2 p. 411",
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page79.pdf",
]
obsolete = true
rare = true

[mm]
# C.I.P. 32 Win. SL, maximum cartridge: rim R1, base P1, neck H2, case L3, length L6, bullet G1.
rim = 9.91
base = 8.93
neck = 8.81
case_length = 32.77
overall_length = 47.75
bullet = 8.18
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page79.pdf"]

[introduced]
# COTW: the Model 1905 rifle came out in 1905-06.
year = 1905
sources = ["book:cotw-18 p. 203"]

[primer]
size = "small-rifle"
sources = ["book:cotw-18 p. 250"]

[case_head]
# C.I.P. 32 Win. SL: R, E, E1, delta. The groove is a shallow cone that starts at the rim (delta 3°44'24")
rim_thickness = 1.27
ramp_top = 3.49
groove_diameter = 8.64
ramp_angle = 3.7
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page79.pdf"]

[bullet]
type = "softpoint"
sources = ["book:cotw-18 p. 204"]

[case]
# municion.org's photo shows a brass case.
material = "brass"
sources = ["https://municion.org/producto/32-winchester-self-loading/"]
