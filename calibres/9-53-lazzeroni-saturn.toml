# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Lazzeroni's .375 long magnum, on its .577 in. case.
name = "9.53 Lazzeroni Saturn"
guns = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["9.53 saturn", "9.53mm saturn", "lazzeroni saturn"]

origin = "US"
origin_sources = ["https://municion.org/producto/953-mm-lazzeroni-saturn/"]
rare = true

[mm]
rim = 14.66
base = 14.66
shoulder = 14.15
shoulder_at = 58.91
neck = 10.26
case_length = 71.12
overall_length = 91.44
bullet = 9.52
# shoulder_at from the AECC drawing 10-071-BGC-010 (municion.org): SL 58.60 on a case of CL 70.81, taken from the
# mouth (case_length - (CL - SL)).
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/953-mm-lazzeroni-saturn/"]

[introduced]
year = 1996
sources = ["book:cotw-18 p. 416"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 452"]

[shoulder_angle]
# COTW 18 p. 416: a 30-degree shoulder.
degrees = 30
sources = ["book:cotw-18 p. 416"]

[case_head]
# .060 in. (COTW); groove from the AECC drawing 10-071-BGC-010 (municion.org): RT 1.56, HL 4.00, GØ 12.55, GW 1.10,
# HØ 14.62; ramp angle from HL = RT + GW + ((HØ - GØ)/2)/tan(angle).
rim_thickness = 1.52
ramp_top = 4.0
groove_diameter = 12.55
ramp_angle = 38.0
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/953-mm-lazzeroni-saturn/"]

[bullet]
# Soft point: Lazzeroni loads premium hunting bullets from Nosler, Barnes or Swift (COTW 18 p. 416).
type = "softpoint"
sources = ["book:cotw-18 p. 416"]
