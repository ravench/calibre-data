# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# A long bottleneck case, a special-order chambering for the Winchester single-shot rifle; loaded until 1916.
name = ".45-125 Winchester Express"
categories = ["rifle"]
kind = "rimmed"
profile = "round"
aliases = ["45-125 winchester", "45-125 express", "45 express"]

origin = "US"
obsolete = true
rare = true

[mm]
rim = 15.27
base = 13.54
shoulder = 13.23
shoulder_at = 69.9
neck = 11.94
case_length = 82.55
overall_length = 92.2
bullet = 11.58
# No source yet for shoulder_at (estimated: a neck one calibre long and the shoulder at 32 degrees).
sources = ["book:cotw-18 p. 251"]

[introduced]
year = 1886
sources = ["book:cotw-18 p. 240"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 251"]

[bullet]
# Lead: the copper-tubed Express bullet, a lead bullet with a copper tube in its nose (COTW 18 p. 240);
# the load table's "SP" is not a jacketed bullet.
type = "lead"
sources = ["book:cotw-18 p. 240"]

[case]
# municion.org's photo shows a brass case (Winchester's).
material = "brass"
