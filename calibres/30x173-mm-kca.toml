# The Swiss round of the Oerlikon KCA revolver cannon (originally 304 RK; Saab JA 37 Viggen): a
# lacquered steel case with a screwed-in electric primer (Jane's p. 105). The GAU-8's round on the
# same case (30x173 mm GAU-8) has an aluminium case and a percussion primer. Its name gives the bore
# and case length; Jane's table gives the rim, base and neck, the AECC specimen drawing of a KCA round
# on municion.org the shoulder, the head and the length of the round (TL); carried from the mouth,
# its shoulder starts 1.1 mm nearer the mouth than the GAU-8 round's.
name = "30x173 mm KCA"
guns = ["cannon"]
kind = "rimless"
profile = "spitzer"
aliases = ["30x173", "30 mm kca", "30 mm oerlikon kca", "30 mm 304 rk", "30 mm gau-9"]
origin = "CH"
origin_sources = ["https://en.wikipedia.org/wiki/Oerlikon_KCA"]

[mm]
rim = 43.99
base = 43.99
shoulder = 40.08
shoulder_at = 145.18
neck_at = 157.7
neck_base = 31.4
# AECC drawing 30-173-BGE-010 on municion.org: SØ 40.08, NØ 31.40, SL 145.50, NL 15.30, CL 173.32, TL 290.47.
shoulder_angle = 19.1
cite.shoulder_angle = ["https://municion.org/producto/30-x-173-swiss-oerlikon-rk-302-short-neck-kca/"]
neck = 31.5
case_length = 173.0
overall_length = 290.47
bullet = 30.0
sources = [
  "book:janes-ammo-2002 p. 682",
  "book:janes-ammo-2002 p. 105",
  "https://municion.org/producto/30-x-173-swiss-oerlikon-rk-302-short-neck-kca/",
]

