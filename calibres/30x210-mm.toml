# The round of the Czechoslovak M53 anti-aircraft cannon, the biggest of the service 30 mm rounds: first
# designed at the Brno works, developed there under the German occupation for the MK 303 and adopted by
# Czechoslovakia in the 1950s. Its name gives the bore and case length (Autocannon: 30x211; Jane's:
# 30x220), Rapid Fire's table the rim and base, Autocannon p. 148 the length of the round, the
# specimen drawing on municion.org («30 x 210 German MK 303») the shoulder, the neck and the head. Brass
# and steel cases were made, so the file names no material.
name = "30x210 mm"
guns = ["cannon"]
kind = "rimless"
profile = "spitzer"
aliases = ["30x211", "30x220", "30 mm m53", "3 cm mk 303"]
origin = "CS"
origin_sources = ["book:autocannon p. 148"]

