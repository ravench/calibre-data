categories = ["black-powder"]
kind = "rimmed"
profile = "round"
aliases = ["500/450 magnum express", "500/450 bpe"]
display_aliases = [".500/450 3¼ inch Magnum Express (BPE)"]

origin = "GB"
obsolete = true
rare = true

[mm]
rim = 16.36
base = 14.48
shoulder = 12.7
shoulder_at = 70.5
