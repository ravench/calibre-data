# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The blackpowder parent of the .500/450 Nitro Express, popular in Africa.
name = ".500/450 Magnum Express"
# Firearms: book:cotw-18 p. 598.
categories = ["black-powder", "rifle"]
kind = "rimmed"
profile = "round"
aliases = ["500/450 magnum express", "500/450 bpe"]
display_aliases = [".500/450 3¼ inch Magnum Express (BPE)"]

origin = "GB"
origin_sources = []
obsolete = true
rare = true

[mm]
rim = 16.36
base = 14.48
shoulder = 12.7
shoulder_at = 70.5
neck = 12.17
case_length = 82.55
overall_length = 99.31
bullet = 11.63
# shoulder_at estimated: a neck one calibre long and the shoulder at 32 degrees.
unsourced = ["shoulder_at"]
sources = ["book:cotw-18 p. 608"]

[introduced]
# COTW: the 1870s; the decade's first year is kept.
year = 1870
sources = ["book:cotw-18 p. 598"]

[primer]
# The table gives a .254 in. Berdan primer.
size = "berdan-nitro"
sources = ["book:cotw-18 p. 608"]

[case_head]
# AECC drawing 11-083-BBC-030 (municion.org): RT 1.04. municion.org lists this 3¼ in. case for the blackpowder, the
# nitro-for-black and the Nitro Express loads. Its shoulder is not taken: the specimen's (SØ 13.19) is 0.49 mm wider
# than the book's, and its cone, drawn between the book's diameters, would leave a neck 2.6 mm longer than the
# specimen's (NL 15.40), over the 1.5 mm the rule allows.
rim_thickness = 1.04
sources = ["https://municion.org/producto/500-450-express-3-1-4-bp-nbp-ne/"]

[bullet]
# A blackpowder express round of the 1870s (COTW 18 p. 598), lead like the express bullets of its time;
# the page lists its factory loads as soft points.
type = "lead"
sources = []

[case]
material = "brass"
sources = []
