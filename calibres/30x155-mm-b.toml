sources = ["https://en.wikipedia.org/wiki/Nudelman-Rikhter_NR-30"]

[case_head]
# The drawing 30-155-BFC-010: RØ 39.83, HØ 39.72, LØ 41.36, RT 3.37, GØ 34.31, GW 4.60,
