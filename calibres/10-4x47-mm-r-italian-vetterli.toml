# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The Italian Vetterli M1870 and Vetterli-Vitali rifles.
name = "10.4x47 mm R Italian Vetterli"
# Guns: book:cotw-18 p. 561.
guns = ["rifle"]
black_powder = true
kind = "rimmed"
profile = "round"
aliases = ["10.4x47r", "italian vetterli"]
display_aliases = ["10.4 mm Vetterli M1870"]

origin = "IT"
origin_sources = ["https://naboje.org/node/1366"]
obsolete = true
rare = true

[mm]
rim = 16.1
base = 13.72
shoulder = 13.13
shoulder_at = 34.75
neck_at = 38.5
neck_base = 11.15
neck = 11.1
case_length = 47.5
overall_length = 62.48
bullet = 10.92
# shoulder_at from the AECC drawing 11-048-BBC-005 (municion.org): SL 34.70 on a case of CL 47.45, taken from the
# mouth (case_length - (CL - SL)).
sources = ["book:cotw-18 p. 574", "https://municion.org/producto/1035-x-47-r-italian-vetterli-m-1870-71-m-1890/"]

[introduced]
year = 1870
sources = ["book:cotw-18 p. 561"]

[primer]
size = "large-rifle"
sources = []

[shoulder_angle]
# AECC drawing on municion.org: SØ 13.00, NØ 11.15, SL 34.70, NL 9.00, CL 47.45.
degrees = 13.9
sources = ["https://municion.org/producto/1035-x-47-r-italian-vetterli-m-1870-71-m-1890/"]

[case_head]
# .058 in. (COTW); the AECC drawing 11-048-BBC-005 (municion.org) has RT 1.60.
rim_thickness = 1.47
sources = ["book:cotw-18 p. 574"]

[bullet]
