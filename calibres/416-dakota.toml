# Measurements converted from inches.
# A full-length .404 Jeffery case with a slightly larger rim, for magnum-length actions. Ballistic Studies
# says Dakota stopped making it.
# Dakota Arms became Parkwest Arms in 2021 (COTW 18 p. 424).
name = ".416 Dakota"
guns = ["rifle"]
kind = "rimless"
# Nose: round, as on the other dangerous-game rounds; the page gives none.
profile = "round"
aliases = ["416 dakota"]

origin = "US"
origin_sources = ["https://naboje.org/node/19109"]
obsolete = true
rare = true

[mm]
rim = 13.82
base = 13.82
shoulder = 13.39
shoulder_at = 57.81
# Hornady's Handbook (7th/8th ed.) drawing on loaddata.com: 30 deg; its shoulder (2.276 in.) and neck start
# (2.350) give 29.9.
shoulder_angle = 30
cite.shoulder_angle = ["https://loaddata.com/Cartridge/416-Dakota-Hornady-Handbook-of-Cartridge-Reloading-7th-8th-Editions/1737"]
neck = 11.2
case_length = 72.39
overall_length = 92.58
bullet = 10.57
# shoulder_at: 2.276 in. on the drawing in Hornady's Handbook (7th/8th ed.) on loaddata.com, which agrees
# with COTW within .001 in. on rim, shoulder, neck and case length (2.850 in.).
sources = [
  "book:cotw-18 p. 453",
  "https://loaddata.com/Cartridge/416-Dakota-Hornady-Handbook-of-Cartridge-Reloading-7th-8th-Editions/1737",
]

[introduced]
# Ballistic Studies: Don Allen brought out his Dakota rounds in 1992; COTW gives no year.
year = 1992
sources = ["https://www.ballisticstudies.com/Knowledgebase/Dakota+proprietary+cartridges.html"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 453"]

[case_head]
# .042 in. (COTW); groove from the drawing 10-065-BGC-020 of the .375 Dakota, which has the same
# modified .404 Jeffery head on a shorter case (COTW 18 pp. 415 and 424): RT 1.25, HL 3.20, GØ 12.08, GW 1.00, HØ 13.80;
# ramp angle from HL = RT + GW + ((HØ - GØ)/2)/tan(angle). No drawing of the .416 itself was found.
rim_thickness = 1.07
ramp_top = 3.2
groove_diameter = 12.08
ramp_angle = 42.0
groove_width = 1
sources = ["book:cotw-18 p. 453", "https://municion.org/producto/375-dakota/", "book:cotw-18 p. 424"]

[bullet]
# Soft point inferred from its use as a hunting round; the page gives weights only.
type = "softpoint"
sources = []
