# Measurements from the C.I.P. sheet (maximum cartridge).
# Named as its C.I.P. sheet is («7,92 x 24 VBR»): the maker's initials tell it from the German 7.92 mm rounds.
# VBR-Belgium's PDW and pistol round, a straight case that tapers to the mouth. The dimension table of
# Cartridges of the World (18th ed., p. 527) has its rim and neck diameters in the wrong columns.
name = "7.92x24 mm VBR"
guns = ["handgun"]
kind = "rimless"
profile = "round"
aliases = ["7.92x24", "7.92 vbr"]

origin = "BE"
origin_sources = [
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page52.pdf",
]
rare = true

[mm]
# C.I.P. 7,92 x 24 VBR, maximum cartridge: rim R1, base P1, neck H2, case L3, length L6, bullet G1.
rim = 9.14
base = 9.06
neck = 8.62
case_length = 24.0
overall_length = 32.1
bullet = 7.92
sources = [
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page52.pdf",
  "book:cotw-18 p. 527",
]

[introduced]
year = 2006
sources = ["book:cotw-18 p. 472"]

[primer]
size = "small-pistol"
sources = ["book:cotw-18 p. 527"]

[case_head]
# C.I.P. 7,92 x 24 VBR: R, E, E1, delta
rim_thickness = 1.27
ramp_top = 2.9
groove_diameter = 7.87
ramp_angle = 37.0
groove_width = 0.84
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page52.pdf"]

[bullet]
type = "jacketed"
sources = ["book:cotw-18 p. 472"]
