# Measurements from the C.I.P. sheet (maximum cartridge).
# Westley Richards's answer to the .310 Greener, for Martini and Sherwood target rifles.
name = ".300 Sherwood"
guns = ["rifle"]
kind = "rimmed"
# Nose: flat, as the AECC specimen drawing shows it (https://municion.org/producto/300-sherwood/).
profile = "flat"
aliases = ["300 sherwood", "300sherwood"]

origin = "GB"
origin_sources = [
  "book:ammo-encyclopedia-2 p. 400",
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page73.pdf",
]
obsolete = true
rare = true

[mm]
rim = 9.52
base = 8.13
neck = 8.08
case_length = 39.37
overall_length = 51.82
bullet = 7.62
# flat: the AECC drawing (municion.org) gives the flat tip as Ø 4,00 (whole millimetres).
flat = 4.0
cite.flat = ["https://municion.org/producto/300-sherwood/"]
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page73.pdf"]

[introduced]
year = 1901
sources = ["book:cotw-18 p. 583"]

[primer]
# The table gives no primer; small rifle, as the .297/230 Morris and the .310 Cadet (.177 in. on COTW 18 p. 608).
size = "small-rifle"
sources = []

[case_head]
# R on the C.I.P. sheet.
rim_thickness = 1.27
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page73.pdf"]

[bullet]
# COTW: solid lead or Leslie Taylor's capped bullets.
type = "lead"
sources = ["book:cotw-18 p. 583"]

[case]
# municion.org's photo shows a brass case.
material = "brass"
sources = ["https://municion.org/producto/300-sherwood/"]
