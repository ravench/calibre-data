# Measurements from the C.I.P. sheet (maximum cartridge).
# Semi-rimmed; designed by F. W. Jones for the Canadian Ross straight-pull rifle. GB kept as origin.
name = ".280 Ross"
categories = ["rifle"]
kind = "semi-rimmed"
profile = "spitzer"
aliases = ["280ross", "280 ross", "280 rimless"]

origin = "GB"
origin_sources = ["book:ammo-encyclopedia-2 p. 394"]
obsolete = true
rare = true

[mm]
# C.I.P. 280 Riml. N.E. Ross, maximum cartridge: rim R1, base P1, shoulder P2 at L1, neck H2, case L3, length L6, bullet G1.
rim = 14.22
base = 13.59
shoulder = 10.72
shoulder_at = 55.4
neck = 8.13
case_length = 66.32
overall_length = 87.88
bullet = 7.29
sources = [
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page104.pdf",
  "book:cotw-18 p. 608",
]

[introduced]
year = 1906
sources = ["book:cotw-18 p. 582"]

[primer]
# The table gives a .217 in. Berdan primer, within 0.2 mm of the large Boxer size.
size = "large-rifle"
diameter = 5.51
sources = ["book:cotw-18 p. 608"]

[shoulder_angle]
# C.I.P. 280 Riml. N.E. Ross: half the cone angle alpha 53°07'48"
degrees = 26.6
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page104.pdf"]

[case_head]
# C.I.P. 280 Riml. N.E. Ross: R, E, E1, delta
rim_thickness = 1.52
ramp_top = 3.58
groove_diameter = 12.45
ramp_angle = 28.7
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-i/tabical-en-page104.pdf"]

[bullet]
type = "softpoint"
sources = ["book:cotw-18 p. 582"]

[case]
material = "brass"
sources = []
