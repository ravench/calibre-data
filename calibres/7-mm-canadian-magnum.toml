ramp_angle = 46.0
groove_width = 1.12
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/7-mm-imperial-magnum/"]

[bullet]
# Soft point inferred from its use as a hunting round; the page gives weights only.
type = "softpoint"
