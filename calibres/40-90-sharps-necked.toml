# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# For the Sharps side-hammer rifles; the 40-100 load used the same case.
name = ".40-90 Sharps Necked"
# Guns: book:cotw-18 p. 220.
guns = ["rifle"]
black_powder = true
kind = "rimmed"
# Nose: flat, as the AECC specimen drawing shows it (https://municion.org/producto/40-90-370-sharps-necked-2-5-8-case/).
profile = "flat"
aliases = ["40-90 sharps necked", "40-100 sharps necked"]

origin = "US"
origin_sources = ["https://municion.org/producto/40-90-370-sharps-necked-2-5-8-case/"]
obsolete = true
rare = true

[mm]
rim = 15.29
base = 12.85
shoulder = 12.7
shoulder_at = 46.35
# AECC drawing on municion.org: SØ 12.50, NØ 10.84, SL 46.56, NL 16.02, CL 67.01.
shoulder_angle = 10.6
cite.shoulder_angle = ["https://municion.org/producto/40-90-370-sharps-necked-2-5-8-case/"]
neck = 11.05
case_length = 66.8
overall_length = 87.38
bullet = 10.24
# flat: the AECC drawing (municion.org) gives the flat tip as Ø 5,00 (whole millimetres).
flat = 5.0
sources = [
  "book:cotw-18 p. 251",
  "https://municion.org/producto/40-90-370-sharps-necked-2-5-8-case/",
]

[introduced]
year = 1873
sources = ["book:cotw-18 p. 220"]

[primer]
# The table gives B-1, a Berdan primer without its size.
size = "large-rifle"
sources = []

[case_head]
# .060 in.
rim_thickness = 1.52
sources = ["book:donnelly p. 502"]

[bullet]
type = "lead"
sources = ["book:cotw-18 p. 221"]

[case]
# municion.org's photos show brass cases (Winchester's and unmarked ones).
material = "brass"
sources = ["https://municion.org/producto/40-90-370-sharps-necked-2-5-8-case/"]
