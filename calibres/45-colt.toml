# Round nose with a small flat, as factory lead loads come (Winchester X45CP2 "255 gr Lead Round
# Nose", Raven's W-W round photographed 2026-11-08), not the wide flat point; the 1873 original
# was an "ogival & flat nosed" 255 gr bullet (Wikipedia).
name = ".45 Colt"
categories = ["handgun"]
kind = "rimmed"
profile = "round"
aliases = ["45colt", "45lc", "45longcolt"]
display_aliases = [".45 Long Colt"]

origin = "US"
origin_sources = [
  "https://en.wikipedia.org/wiki/.45_Colt",
  "book:ammo-encyclopedia-2 p. 710",
]

[mm]
# SAAMI 45 Colt, maximum cartridge; bullet .454 in from COTW 18 like its lookalikes (SAAMI's
# lead bullet is .4560 in max).
rim = 13.0
base = 12.19
neck = 12.19
case_length = 32.64
overall_length = 40.64
bullet = 11.53
sources = ["https://saami.org/wp-content/uploads/2025/05/SAAMI-Z299.3-2022-Centerfire-Pistol-Revolver-Approved-12-13-2022.pdf#page=59", "book:cotw-18 p. 529"]

[introduced]
# designed 1872, produced from 1873
year = 1873
sources = ["https://en.wikipedia.org/wiki/.45_Colt"]

[primer]
size = "large-pistol"
sources = ["https://en.wikipedia.org/wiki/.45_Colt"]

[case_head]
# SAAMI 45 Colt
rim_thickness = 1.52
sources = ["https://saami.org/wp-content/uploads/2025/05/SAAMI-Z299.3-2022-Centerfire-Pistol-Revolver-Approved-12-13-2022.pdf#page=59"]

[bullet]
type = "lead"
sources = ["https://en.wikipedia.org/wiki/.45_Colt"]

[case]
# Frankford Arsenal's first army rounds (1873/74, Benét-primed) had copper cases; the photo shows one next
# to a .45 Schofield and a brass round of today.
material = "copper"
sources = ["https://commons.wikimedia.org/wiki/File:Colt_.45_LC_Cartridges.JPG"]

[current_cases]
# Starline's brass cases; CCI Blazer's aluminium cases.
materials = ["brass", "aluminium"]
