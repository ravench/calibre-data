# .22 crimped blank, the size of the yellow/green/red power-tool loads and starter pistol
# blanks. C.I.P. lists this size as «22 SH (5,6/11)»: a 5.6 mm (.22) case, 11 mm long. Its «6,8/11»
# is the .27 calibre load (rim 8.50, body 6.86), which this entry was named after by mistake.
# Crimp shape after fired ones in Raven's photos (2026-11-04): the star opens on firing but the
# petals stay narrower than the body.
name = ".22 Blank (6.8/11)"
categories = ["rimfire"]
kind = "rimfire"
profile = "crimped"
aliases = ["22blank", "6.8/11", "6.8x11", "platzpatrone", "kartusche", "setzkartusche", "bolzensetzer"]
display_aliases = [".22 Platzpatrone", "Setzkartusche 6.8/11"]

[mm]
# C.I.P. 22 SH (5,6/11), maximum cartridge: rim R1, base P1, length L6 (crimped; the open case L3 is
# 11.50). C.I.P. gives no crimp size: the mouth is measured on Raven's photos.
rim = 7.06
base = 5.74
mouth = 3.4
length = 11.1
unsourced = ["mouth"]
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-vi/tabvical-en-page3.pdf"]

[introduced]
unknown = "a family of blanks and power-tool loads with no single launch"

[case_head]
# R on the C.I.P. 22 SH (5,6/11) sheet
rim_thickness = 1.12
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-vi/tabvical-en-page3.pdf"]

[case]
material = "brass"
sources = []
