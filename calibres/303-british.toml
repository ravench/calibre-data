name = ".303 British"
guns = ["rifle"]
kind = "rimmed"
# Nose: round, as first loaded (the Wikipedia page below); pointed service bullets came only from 1898
# (COTW 18 p. 553).
profile = "round"
# Today: pointed, since the Mk VII round of 1910 (https://en.wikipedia.org/wiki/.303_British).
profile_today = "spitzer"
aliases = ["303", "303brit", "7.7x56r"]

origin = "GB"
origin_sources = [
  "https://en.wikipedia.org/wiki/.303_British",
  "book:ammo-encyclopedia-2 p. 323",
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page74.pdf",
]

[mm]
rim = 13.72
base = 11.7
shoulder = 10.2
shoulder_at = 45.47
neck_at = 48.01
neck_base = 8.64
# C.I.P. 303 British
shoulder_angle = 17
cite.shoulder_angle = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page74.pdf"]
neck = 8.6
case_length = 56.4
overall_length = 78.1
bullet = 7.92
sources = [
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page74.pdf",
  "book:cotw-18 p. 608",
  "book:donnelly p. 347",
]

[introduced]
year = 1888
sources = ["https://en.wikipedia.org/wiki/.303_British"]

[primer]
size = "large-rifle"
sources = ["https://en.wikipedia.org/wiki/.303_British"]

[case_head]
# R on the C.I.P. sheet.
rim_thickness = 1.63
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page74.pdf"]

[bullet]
# The first loading's round-nose bullet had a cupronickel jacket (COTW 18 p. 549).
type = "jacketed"
jacket = "cupronickel"
sources = ["book:cotw-18 p. 550", "book:cotw-18 p. 549"]

[case]
# municion.org's photos show brass cases (the Royal Laboratory's, Dominion's and FN's).
material = "brass"
sources = ["https://municion.org/producto/303-british/"]

