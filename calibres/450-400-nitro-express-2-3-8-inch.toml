# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The .450 case shortened and necked down; blackpowder first, Nitro-for-Black and Nitro Express later.
name = ".450/400 Nitro Express 2⅜ inch"
# Firearms: book:cotw-18 p. 593.
categories = ["black-powder", "rifle"]
kind = "rimmed"
profile = "round"
aliases = ["450/400 2 3/8", "450/400 2.375"]

origin = "GB"
origin_sources = ["https://municion.org/producto/450-400-express-2-3-8/"]
obsolete = true
rare = true

[mm]
rim = 15.65
base = 13.84
shoulder = 11.58
shoulder_at = 46.1
neck = 10.85
case_length = 60.45
overall_length = 74.93
bullet = 10.34
# No source yet for shoulder_at (estimated: a neck one calibre long and the shoulder at 5.2 degrees).
sources = ["book:cotw-18 p. 608"]

[introduced]
# COTW: the blackpowder load, circa 1880.
year = 1880
sources = ["book:cotw-18 p. 593"]

[primer]
size = "large-rifle"
sources = []

[shoulder_angle]
# The 10.3x60 R's (C.I.P. 10,3 x 60 R), assumed, not measured: COTW 18 p. 645 calls that round the
# Swiss version of this one. Its diameters are not the same (C.I.P. neck 11.26 against COTW's 10.85 mm,
# shoulder 12.50 against 11.58 mm), but both are the long, gentle taper of the .450 cases, like the
# 3¼ inch (C.I.P. 5.6 deg), not the 3 inch's 15.
degrees = 5.2
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page52.pdf"]

[case_head]
# .035 in.
rim_thickness = 0.89
sources = ["book:cotw-18 p. 608"]

[bullet]
# The blackpowder load.
type = "lead"
sources = ["book:cotw-18 p. 593"]

[case]
# municion.org's photos show brass cases (ICI's, Eley's, RWS's and Nagel & Menz's).
material = "brass"
sources = ["https://municion.org/producto/450-400-express-2-3-8/"]
