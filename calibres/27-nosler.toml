# Rifle batch 5 (2026-11): first added from the page named in INTRODUCED, now SAAMI's (see [mm]); the Nosler line shares the .28 Nosler case outside.
name = ".27 Nosler"
guns = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["27nosler"]

origin = "US"
origin_sources = ["https://en.wikipedia.org/wiki/Nosler_cartridges"]
# Still made, but hardly ever found:
rare = true

[mm]
# SAAMI 27 Nosler, maximum cartridge.
# Shoulder and shoulder_at: SAAMI's, where the body and shoulder lines meet.
rim = 13.56
base = 13.97
shoulder = 13.42
shoulder_at = 53.56
neck_at = 57.45
neck_base = 7.98
# Nosler's "27 Nosler Rifle Cartridge" drawing: 35 deg, shoulder at 2.109 in, neck at 2.262 in
shoulder_angle = 35
cite.shoulder_angle = ["https://www.nosler.com/"]
neck = 7.98
case_length = 65.79
overall_length = 84.84
bullet = 7.06
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=99", "book:cotw-18 p. 451", "https://www.nosler.com/"]

[introduced]
year = 2020
sources = ["https://en.wikipedia.org/wiki/.28_Nosler"]

[primer]
size = "large-rifle"
sources = ["https://en.wikipedia.org/wiki/.28_Nosler"]

[case_head]
# SAAMI 27 Nosler: rim thickness 0.050, groove 0.475 at 32 degrees, groove width 0.037,
# body 0.5500; ramp_top = rim thickness + groove width + ramp height ((body - groove) / 2 / tan 32)
rim_thickness = 1.27
ramp_top = 3.73
groove_diameter = 12.07
ramp_angle = 32.0
groove_width = 0.94
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=99"]

[bullet]
type = "polymer"
sources = ["https://en.wikipedia.org/wiki/.28_Nosler"]
