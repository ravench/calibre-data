# generic one.
rim_thickness = 1.5
sources = ["https://municion.org/producto/50-115-300-bullard/"]

[bullet]
type = "lead"
sources = ["book:cotw-18 p. 245"]

[case]
# The photos show brass cases (unmarked ones).
material = "brass"
