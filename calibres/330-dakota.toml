# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# A shortened .404 Jeffery case for .338 in. bullets in a .30-06-length action.
# Dakota Arms became Parkwest Arms in 2021 (COTW 18 p. 406).
name = ".330 Dakota"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["330 dakota"]

origin = "US"
origin_sources = ["https://municion.org/producto/330-dakota/"]
rare = true

[mm]
rim = 13.82
base = 13.82
shoulder = 13.46
shoulder_at = 53.65
neck = 9.42
case_length = 65.28
overall_length = 84.33
bullet = 8.59
sources = ["book:cotw-18 p. 452", "https://municion.org/producto/330-dakota/"]

[introduced]
# Ballistic Studies: Don Allen brought out his Dakota rounds in 1992; COTW gives no year.
year = 1992
sources = ["https://www.ballisticstudies.com/Knowledgebase/Dakota+proprietary+cartridges.html"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 452"]

[shoulder_angle]
# AECC drawing on municion.org: SØ 13.38, NØ 9.36, SL 52.50, NL 7.40, CL 64.13.
degrees = 25.4
sources = ["https://municion.org/producto/330-dakota/"]

[case_head]
# .045 in.
rim_thickness = 1.14
sources = ["book:cotw-18 p. 452"]

[bullet]
# Soft point inferred from its use as a hunting round; the page gives weights only.
type = "softpoint"
sources = []

[case]
material = "brass"
sources = []
