kind = "belted"
profile = "spitzer"
aliases = ["20x105b", "20 mm short solothurn", "s-18/100", "s18-100"]
# Waffenfabrik Solothurn, a Swiss front company of Rheinmetall, made the gun, as with the 20x138 mm B;
# Wikipedia names Germany and Switzerland: CH
origin = "DE"
