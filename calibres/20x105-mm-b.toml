# Solothurn's short 20 mm round, for the S-18/100 anti-tank rifle and the early MG 204 aircraft cannon
# (the later MG 204 fired the rimless 20x105 mm). Its name gives the bore and case length; Jane's table
# gives the rim, the belt and the neck, Rapid Fire's table the base, Autocannon p. 116 the length of the
# round, the specimen drawing on municion.org the shoulder and the head.
