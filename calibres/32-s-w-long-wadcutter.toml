# Target load for ISSF 25 m centre-fire pistols, its own C.I.P. cartridge ("32 S&W Long Wad Cut.",
# tab-iv/tabivcal-en-page46.pdf, sheet 1984-06-14, origin DE/FI): higher pressure (Pmax 1550 bar against 1000) and a
# chamber with a 3 mm instead of 11 mm throat, so C.I.P. treats it as its own cartridge on the same
# case. Maximum cartridge R1/P1/H2/G1/L3 from the sheet. Drawn with the wadcutter seated flush with
# the case mouth, as it is usually loaded (https://bullseyeforum.net/t16197-32-sw-long-wadcutter-oal),
# so the length is L3 (L6 allows up to 25.40) and no bullet shows from the side.
name = ".32 S&W Long Wadcutter"
categories = ["handgun"]
kind = "rimmed"
profile = "flat"
aliases = ["32wc", "32swlwc", "32longwc", "32 s&w long wc", "32 s&w lwc"]
display_aliases = [".32 S&W Long WC"]

# the C.I.P. sheet gives "DE/FI"
origin_candidates = ["DE", "FI"]

[mm]
rim = 9.53
base = 8.56
neck = 8.56
case_length = 23.27
overall_length = 23.27
bullet = 8.0
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-iv/tabivcal-en-page46.pdf"]

[introduced]
unknown = "C.I.P. sheet dated 1984-06-14 like the .32 S&W Long's; no launch year found"

[primer]
# the same case
size = "small-pistol"
sources = ["https://en.wikipedia.org/wiki/.32_S%26W_Long"]

[case_head]
# R on the C.I.P. sheet.
rim_thickness = 1.4
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-iv/tabivcal-en-page46.pdf"]

[bullet]
type = "lead"
sources = ["https://www.lapua.com/product/32-sw-lapua-wadcutter-bullet-c427-535-g-83-gr/"]

[case]
material = "brass"
sources = []
