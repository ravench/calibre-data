obsolete = true
rare = true

[mm]
rim = 13.36
base = 11.53
neck = 10.08
case_length = 45.72
overall_length = 57.4
bullet = 9.47
# flat: the AECC drawing (municion.org) gives the flat tip as Ø 6,00 (whole millimetres).
