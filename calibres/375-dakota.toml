# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The .404 Jeffery case shortened and necked down, to match the .375 H&H from a .30-06-length action.
# Dakota Arms became Parkwest Arms in 2021 (COTW 18 p. 415).
name = ".375 Dakota"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["375 dakota"]

origin = "US"
rare = true

[mm]
rim = 13.82
base = 13.82
shoulder = 13.44
shoulder_at = 53.2
neck = 10.21
case_length = 65.28
overall_length = 84.33
bullet = 9.52
# No source yet for shoulder_at (estimated: a neck one calibre long and the shoulder at 32 degrees).
sources = ["book:cotw-18 p. 452"]

[introduced]
# Ballistic Studies: Don Allen brought out his Dakota rounds in 1992; COTW gives no year.
year = 1992
sources = ["https://www.ballisticstudies.com/Knowledgebase/Dakota+proprietary+cartridges.html"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 452"]

[case_head]
# .046 in.
rim_thickness = 1.17
sources = ["book:cotw-18 p. 452"]

[bullet]
# Soft point inferred from its use as a hunting round; the page gives weights only.
type = "softpoint"
sources = []

[case]
material = "brass"
sources = []
