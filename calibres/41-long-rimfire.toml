# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# The .41 Short lengthened, first for Colt's New Line revolvers; obsolete since the 1920s.
name = ".41 Long Rimfire"
# Firearms: book:cotw-18 p. 665.
categories = ["rimfire", "handgun", "rifle"]
kind = "rimfire"
profile = "round"
aliases = ["41 long rf", "41 long rimfire"]

origin = "US"
obsolete = true
rare = true

[mm]
rim = 11.89
base = 10.34
neck = 10.34
case_length = 16.13
overall_length = 25.02
bullet = 10.29
sources = ["book:cotw-18 p. 670"]

[introduced]
year = 1873
sources = ["book:cotw-18 p. 665"]

[bullet]
# COTW 18 p. 665 does not name the bullet's material; lead, as in the other rimfire rounds of its time.
type = "lead"
sources = ["https://municion.org/ficha-10-016-cbr-010-0001/"]

[case]
# municion.org's photos show copper cases on the early makers' rounds (U.S. Cartridge Co., UMC and Phoenix).
material = "copper"
sources = ["https://municion.org/producto/41-long-rf/"]
