# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# A stronger BB Cap with a conical bullet; case lengths varied between makers.
name = ".22 CB Cap"
kind = "rimfire"
profile = "round"
aliases = ["22 cb cap", "22cb", "cb cap"]

origin = "US"
obsolete = true
rare = true

[mm]
rim = 6.88
base = 5.71
neck = 5.71
case_length = 10.67
overall_length = 13.21
bullet = 5.64
sources = ["book:cotw-18 p. 670"]

[introduced]
# COTW: in catalogues from about 1888, though it is older.
year = 1888
sources = ["book:cotw-18 p. 656"]

[case_head]
# .040 in.
rim_thickness = 1.02
sources = ["book:cotw-18 p. 670"]

[bullet]
# COTW 18 p. 656 does not name the bullet's material; lead, as in the other rimfire rounds of its time.
type = "lead"
sources = []

[case]
# municion.org's page for the BB and CB caps shows copper cases from Winchester, UMC, Dominion
# and Western, the conical-bullet caps in its family photo included. Peters' later heads are brass.
material = "copper"
sources = ["https://municion.org/producto/22-bb-cb-cap/"]
