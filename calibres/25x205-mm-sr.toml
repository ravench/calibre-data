origin = "SE"
origin_sources = ["book:rapid-fire p. 228"]

[mm]
rim = 42.01
base = 36.91
neck = 25.7
case_length = 205.0
overall_length = 265.0
bullet = 25.0
sources = ["book:janes-ammo-2002 p. 682", "book:autocannon p. 132", "book:rapid-fire p. 228"]

