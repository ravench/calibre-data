# The round of the Swedish Bofors m/32 anti-aircraft cannon, which inspired the Soviet 25 mm rounds; from
# the late 1930s the guns fired the shorter 25x187 mm SR m/38. Its name gives the bore and case length,
# Jane's table the rim, base and neck, Autocannon p. 132 the length of the round.
