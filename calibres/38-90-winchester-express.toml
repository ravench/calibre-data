# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# For the Winchester Model 1885 single-shot; dropped by 1904.
name = ".38-90 Winchester Express"
guns = ["rifle"]
kind = "rimmed"
profile = "round"
aliases = ["38-90", "38-90 winchester", "38 express"]

origin = "US"
origin_sources = ["book:ammo-encyclopedia-2 p. 430"]
obsolete = true
rare = true

[mm]
rim = 14.17
base = 12.12
shoulder = 11.94
shoulder_at = 59.95
neck = 10.03
case_length = 82.55
overall_length = 93.98
bullet = 9.55
# A long, gentle shoulder, not a straight case: COTW 18 calls the case bottlenecked (case type A). It looks like a
# plain taper on small photos (gunauction.com 8333040).
# shoulder_at from the AECC drawing 09-083-BBC-010 (municion.org): SL 60.00 on a case of CL 82.60, taken from the mouth
# (case_length - (CL - SL)). Donnelly prints the same start (J 2.36 in. = 59.94). The drawing's shoulder
# diameter (SØ 10.95) is 1.0 mm narrower than the book's, which stays.
sources = ["book:cotw-18 p. 250", "https://municion.org/producto/38-90-217-winchester-express/", "book:donnelly p. 489"]

[introduced]
year = 1886
sources = ["book:cotw-18 p. 215"]

[primer]
size = "large-rifle"
sources = ["book:cotw-18 p. 250"]

[shoulder_angle]
# The book's shoulder and neck diameters over the shoulder length of the AECC drawing (CL 82.60 - NL 17.00 -
# SL 60.00 = 5.60 mm). Donnelly's lengths (K .240 in.) give 8.9; his printed angles are not used.
degrees = 9.7
sources = ["https://municion.org/producto/38-90-217-winchester-express/"]

[case_head]
# AECC drawing 09-083-BBC-010 (municion.org): RT 1.68.
rim_thickness = 1.68
sources = ["https://municion.org/producto/38-90-217-winchester-express/"]

[bullet]
type = "lead"
sources = ["book:cotw-18 p. 215"]

[case]
# municion.org's photos show brass cases (UMC's and Winchester's).
material = "brass"
sources = ["https://municion.org/producto/38-90-217-winchester-express/"]
