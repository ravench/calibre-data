# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# An early Ballard Everlasting case, later altered to the .40-70 Ballard of the same length.
name = ".40-65 Ballard Everlasting"
# Firearms: book:cotw-18 p. 220.
categories = ["black-powder", "rifle"]
kind = "rimmed"
profile = "round"
aliases = ["40-65 ballard", "40-65 ballard everlasting"]

origin = "US"
origin_sources = ["https://municion.org/producto/40-65-ballard-everlasting/"]
obsolete = true
rare = true

[mm]
rim = 15.24
base = 12.9
neck = 11.05
case_length = 60.45
# The table's overall length (2.55 in.) repeats the 40-60 Marlin row's in COTW 18 and COTW 5; kept.
overall_length = 64.77
bullet = 10.24
sources = ["book:cotw-18 p. 250"]

[introduced]
year = 1876
sources = ["book:cotw-18 p. 220"]

[primer]
# The table gives B-1, a Berdan primer without its size.
size = "large-rifle"
sources = []

[bullet]
# COTW 18 p. 220 gives no load of its own; municion.org's one sheet (a tinned case, no maker) shows a
# paper-patched lead bullet.
type = "paper"
sources = ["https://municion.org/ficha-10-060-cbc-030-0001/"]

[case]
material = "brass"
sources = []
