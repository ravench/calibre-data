# Added 2026-11: further mass-produced handgun rounds, current and obsolete. Dimensions from
# the page named in INTRODUCED (mostly the Wikipedia infobox, which quotes C.I.P./SAAMI),
# rounded; shoulder heights of bottleneck cases are estimated for drawing.
name = ".32-20 Winchester"
# Guns: https://en.wikipedia.org/wiki/Winchester_rifle#Model_1873 (the Winchester 1873 rifle, later made in .32-20).
guns = ["handgun", "rifle"]
kind = "rimmed"
profile = "flat"
# The 32-20 Marlin (COTW 18 p. 200) was this round loaded for the Marlin 1894, with a lighter bullet.
aliases = ["32-20", "32wcf", "32-20 marlin"]

origin = "US"
origin_sources = [
  "https://en.wikipedia.org/wiki/.32-20_Winchester",
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page81.pdf",
]

[mm]
rim = 10.4
base = 9.0
shoulder = 8.7
shoulder_at = 22.35
neck_at = 23.85
neck_base = 8.4
# C.I.P. 32-20 Win.
shoulder_angle = 5.7
cite.shoulder_angle = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page81.pdf"]
neck = 8.3
case_length = 33.4
overall_length = 40.4
bullet = 7.94
# flat: the AECC drawing (municion.org) gives the flat tip as Ø 5,00 (whole millimetres).
flat = 5.0
cite.flat = ["https://municion.org/producto/32-20-115-winchester-cf/"]
sources = [
  "https://en.wikipedia.org/wiki/.32-20_Winchester",
  "https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page81.pdf",
]

[introduced]
year = 1882
sources = ["https://en.wikipedia.org/wiki/.32-20_Winchester"]

[primer]
size = "small-pistol"
sources = ["https://en.wikipedia.org/wiki/.32-20_Winchester"]

[case_head]
# R on the C.I.P. sheet.
rim_thickness = 1.65
sources = ["https://bobp.cip-bobp.org/uploads/tdcc/tab-ii/tabiical-en-page81.pdf"]

[bullet]
type = "lead"
sources = ["https://en.wikipedia.org/wiki/.32-20_Winchester"]

[case]
# municion.org's photo shows a brass case.
material = "brass"
sources = ["https://municion.org/producto/32-20-115-winchester-cf/"]
