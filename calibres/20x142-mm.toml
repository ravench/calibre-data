# The round of the Japanese army's Type 98 anti-aircraft cannon, its standard light anti-aircraft gun
# from the late 1930s. Its name gives the bore and case length (Autocannon: 20x143), Rapid Fire's table
# the rim and base, the specimen drawing on municion.org the shoulder, the neck and the head.
# Autocannon (p. 124) gives the round as 214 mm long with the AP shell and 208 mm with HE; the file has
# the HE round's length, which the drawing has too.
name = "20x142 mm"
guns = ["cannon"]
kind = "rimless"
profile = "spitzer"
aliases = ["20x143", "20 mm type 98"]
origin = "JP"
origin_sources = ["https://en.wikipedia.org/wiki/Type_98_20_mm_AA_machine_cannon", "book:rapid-fire p. 227"]

