# Measurements from Cartridges of the World, 18th ed. (inches converted to mm).
# Semi-rimmed; the French Navy's Daudeteau rifle.
name = "6.5x53.5 mm SR Daudeteau"
categories = ["rifle"]
kind = "semi-rimmed"
profile = "round"
aliases = ["6.5daudeteau", "6.5x53.5"]

origin = "FR"
origin_sources = ["book:ammo-encyclopedia-2 p. 502"]
obsolete = true
rare = true

[mm]
rim = 13.31
base = 12.45
shoulder = 11.84
shoulder_at = 39.48
neck = 7.57
case_length = 53.09
overall_length = 76.71
bullet = 6.68
# shoulder_at from the AECC drawing 07-053-BDC-010 (municion.org): SL 39.75 on a case of CL 53.36, taken from the mouth
# (case_length - (CL - SL)). Donnelly prints the start 0.14 mm later (J 1.56 in. = 39.62). The drawing's
# shoulder diameter (SØ 11.26) is 0.58 mm narrower than the book's, which stays.
sources = ["book:cotw-18 p. 651", "https://municion.org/producto/65-x-53-sr-daudeteau-n12/", "book:donnelly p. 768"]

[introduced]
year = 1895
sources = ["book:cotw-18 p. 617"]

[primer]
size = "large-rifle"
sources = []

[shoulder_angle]
# The book's shoulder and neck diameters over the shoulder length of the AECC drawing (CL 53.36 - NL 8.20 -
# SL 39.75 = 5.41 mm). Donnelly's shorter shoulder (K .17 in.) would give 26; his printed angles are not used.
degrees = 21.5
sources = ["https://municion.org/producto/65-x-53-sr-daudeteau-n12/"]

[case_head]
# AECC drawing 07-053-BDC-010 (municion.org): RT 1.80, HL 3.25, GØ 11.31, GW 0.75, HØ 12.45; ramp angle from HL = RT +
# GW + ((HØ - GØ)/2)/tan(angle).
rim_thickness = 1.8
ramp_top = 3.25
groove_diameter = 11.31
ramp_angle = 39.0
sources = ["https://municion.org/producto/65-x-53-sr-daudeteau-n12/"]

[bullet]
# The service or target load, full metal jacket; p. 617 also lists soft points.
type = "jacketed"
sources = ["book:cotw-18 p. 617"]

[case]
material = "brass"
sources = []
