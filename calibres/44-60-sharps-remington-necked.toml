# Measurements converted from inches.
# A 1.88 in. .44 bottleneck case for the 1869 Sharps sporting rifle; loaded by Remington and Winchester.
name = ".44-60 Sharps & Remington Necked"
# Guns: book:cotw-18 p. 236.
guns = ["rifle"]
black_powder = true
kind = "rimmed"
# Nose: flat, as the specimen drawing shows it (https://municion.org/producto/44-60-396-sharps-necked-1-7-8/).
profile = "flat"
# The 44-60 Winchester or Peabody Creedmoor (COTW 18 p. 237) is the same round.
aliases = ["44-60 sharps", "44-60 sharps necked", "44-60 winchester", "44-60 peabody creedmoor"]

origin = "US"
origin_sources = ["book:ammo-encyclopedia-2 p. 453"]
obsolete = true
rare = true

[mm]
rim = 16.0
base = 13.08
shoulder = 12.75
