# Rifle batch 5 (2026-11): first added from the page named in INTRODUCED, now SAAMI's (see [mm]); the Nosler line shares the .28 Nosler case outside.
name = ".30 Remington AR"
categories = ["rifle"]
kind = "rimless"
profile = "spitzer"
aliases = ["30remar"]

origin = "US"
origin_sources = [
  "https://en.wikipedia.org/wiki/.30_Remington_AR",
  "book:ammo-encyclopedia-2 p. 312",
]
obsolete = true
rare = true

[mm]
# SAAMI 30 Remington AR, maximum cartridge.
# Shoulder and shoulder_at: SAAMI's, where the body and shoulder lines meet.
rim = 12.5
base = 12.7
shoulder = 12.41
shoulder_at = 27.13
neck_at = 31.12
neck_base = 8.66
neck = 8.66
case_length = 38.86
overall_length = 57.4
bullet = 7.85
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=110", "https://en.wikipedia.org/wiki/.30_Remington_AR"]

[introduced]
year = 2008
sources = ["https://en.wikipedia.org/wiki/.30_Remington_AR"]

[primer]
size = "small-rifle"
sources = ["https://hodgdonreloading.com/rldc/"]

[shoulder_angle]
degrees = 25
sources = ["https://en.wikipedia.org/wiki/.30_Remington_AR"]

[case_head]
# SAAMI 30 Remington AR: rim thickness 0.054, groove 0.428 at 36 degrees, groove width 0.055,
# body 0.5000; ramp_top = rim thickness + groove width + ramp height ((body - groove) / 2 / tan 36)
rim_thickness = 1.37
ramp_top = 4.03
groove_diameter = 10.87
ramp_angle = 36.0
groove_width = 1.4
sources = ["https://saami.org/wp-content/uploads/2026/10/SAAMI-Z299.4-CFR-2025-Centerfire-Rifle-Approved-2-10-2025-2026-10-21.pdf#page=110"]

[bullet]
