# GP 90/23: «7,5 mm Gewehrpatrone 90/23» («Scharfe Patrone 90/23» on older boxes). Collector sources
# (swisswaffen, FCHM) date it to a Federal Council decision of 9 January 1923, but that decision
# (minutes Nr. 75, Federal Archives 70012164, PDF p. 36-42) is a contract with the new A.G. Moderna
# Patronenfabrik in Solothurn for 20 million «Patronen für Gewehrmodell 89» for the Landsturm, made to
# the existing federal specifications; the Federal Council's report for 1923 still names the round
# «Gewehrpatronen 90/03» (50000263, PDF p. 440-441). No official text up to 1923 uses «90/23». The
# GP 1890 round reworked: a 1 mm longer case, a jacketed
# round-nose bullet (190 gr) and smokeless powder, so the reserve's unaltered IG 89 rifles had a jacketed
# round (Poyer p. 54). It also fires in rifles chambered for GP 11 (FCHM; swisswaffen). Made by the
# Solothurn cartridge factory, designed at Thun (FCHM). Still a Swiss stock item after 1945: «7.5mm Ball
# cartridge M90/23» in the army's part numbers (Labbett p. 118).
# Case: swissrifles.com/ammo (http only, so not a listed source) gives 2.15 in (54.6) case,
# .500 in (12.7) rim, .496 in (12.6) head and a .3075 in (7.8) bullet; Poyer p. 50 gives 7.5x54.5.
# Shoulder, neck and head to shoulder are Raven's caliper values for the Kadettenpatrone (same case, 1964). Length is an estimate: no source gives it.
name = "7.5x54.5 mm Swiss (GP 90/23)"
categories = ["rifle"]
kind = "rimless"
profile = "round"
aliases = ["gp90/23", "gp 90/23", "gp1890/23", "gp 1890/23", "7.5 mm gp 90/23", "patrone 90/23", "scharfe patrone 90/23", "gewehrpatrone 90/23", "7.5x54.5"]
display_aliases = ["GP 90/23"]

origin = "CH"
