# Countries for a calibre's `origin`: the state that introduced it, as a code, with its English name
# and flag emoji. Historical states keep their own code (ISO 3166-3 SU/CS where one exists, else a
# made-up AH/RUE that no ISO code uses, so RU stays today's Russia); they have no flag emoji, so the
# apps draw their own. Unions of states get a code too (NATO for the rounds NATO standardised; the EU
# 🇪🇺 joins when a calibre needs it). IL left with the 9x21 mm (IT).

[CH]
name = "Switzerland"
flag = "🇨🇭"

